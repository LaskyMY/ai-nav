<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI Nav 时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
font-family:sans-serif;
background:#08081a;color:rgba(255,255,255,.88);
display:flex;flex-direction:column;
-webkit-user-select:none;user-select:none;
padding:4px 6px 6px 6px;
}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse at 50% 15%,rgba(0,210,255,.04) 0%,transparent 55%);}

/* Cards */
.c{flex-shrink:0;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.05);border-radius:10px;
padding:7px 10px;position:relative;z-index:1;margin-top:3px;}
.cr{display:flex;margin-top:3px;position:relative;z-index:1;}
.cr>*+*{margin-left:4px;}

/* C1: Clock */
.c1-l{text-align:center;min-width:0;}
.c1-t{font-size:34px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 16px rgba(0,210,255,.18);}
.c1-ms{font-size:14px;color:#00d2ff;min-width:40px;display:inline-block;text-align:left;opacity:.78;}
.c1-r{flex:1;text-align:right;display:flex;flex-direction:column;justify-content:center;}
.c1-d{font-size:12px;color:rgba(255,255,255,.52);}
.c1-lu{font-size:10px;color:rgba(255,255,255,.26);margin-top:1px;}
.c1-ci{font-size:10px;color:rgba(0,210,255,.35);margin-top:1px;}

/* C2: Weather */
.c2-n{display:flex;align-items:center;margin-bottom:3px;}
.c2-n>*+*{margin-left:6px;}
.c2-t{font-size:26px;font-weight:600;color:#fff;}
.c2-d{font-size:11px;color:rgba(255,255,255,.48);}
.c2-h{font-size:10px;color:rgba(255,255,255,.24);margin-top:1px;}
.c2-f{display:flex;}
.c2-f>*+*{margin-left:4px;}
.c2-i{flex:1;text-align:center;background:rgba(255,255,255,.022);border-radius:6px;padding:3px;border:1px solid rgba(255,255,255,.04);}
.c2-i .l{font-size:8px;color:rgba(255,255,255,.26);}
.c2-i .v{font-size:14px;font-weight:600;color:#fff;margin:2px 0;}
.c2-i .r{font-size:8px;color:rgba(0,210,255,.5);}

/* C3: News */
.c3-w{font-size:11px;color:rgba(255,255,255,.55);line-height:1.4;}
.c3-s{color:#00d2ff;font-size:9px;font-weight:700;}

/* C4: Brief */
.c4{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:80px;font-size:10px;line-height:1.4;}
.c4 h2{font-size:12px;font-weight:700;color:#fff;margin:6px 0 3px;}
.c4 h3{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);margin:5px 0 2px;}
.c4 p{color:rgba(255,255,255,.48);margin:2px 0;}
.c4 strong{color:#f0a020;}
.c4 table{width:100%;border-collapse:collapse;margin:3px 0;font-size:9px;}
.c4 td,.c4 th{border:1px solid rgba(255,255,255,.06);padding:2px 4px;}
.c4 th{background:rgba(0,210,255,.05);color:#00d2ff;font-size:9px;}
.c4 .kc{background:rgba(138,43,226,.05);border:1px solid rgba(138,43,226,.1);border-radius:6px;padding:5px 8px;margin:4px 0;}
.c4 .kc p{color:rgba(255,255,255,.55);}

.sp{display:inline-block;width:8px;height:8px;border:2px solid rgba(255,255,255,.1);border-top-color:#00d2ff;border-radius:50%;
animation:sp .6s linear infinite;vertical-align:middle;margin-right:3px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>

<!-- Row: Clock + Date -->
<div class="cr">
  <div class="c c1-l" style="flex:0 0 auto">
    <span class="c1-t" id="t">--:--:--</span><span class="c1-ms" id="ms">.--</span>
  </div>
  <div class="c c1-r" style="flex:1">
    <div class="c1-d" id="d">--</div>
    <div class="c1-lu" id="lu">--</div>
    <div class="c1-ci" id="ci">广州</div>
  </div>
</div>

<!-- Weather -->
<div class="c">
  <div class="c2-n"><span class="c2-t" id="wt">--°</span><span class="c2-d" id="wd">--</span><span style="font-size:10px;color:rgba(255,255,255,.2);" id="wh">--</span></div>
  <div class="c2-f" id="wf"><div class="c2-i"><div class="l">+1时</div><div class="v">--</div></div><div class="c2-i"><div class="l">+3时</div><div class="v">--</div></div><div class="c2-i"><div class="l">+6时</div><div class="v">--</div></div></div>
</div>

<!-- News -->
<div class="c"><div class="c3-w" id="nw">新闻加载中<span class="sp"></span></div></div>

<!-- AI Brief -->
<div class="c c4" id="bf">AI 简报加载中<span class="sp"></span></div>

<script>
var API='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var WX={0:'晴',1:'多云',2:'阴',3:'阴',45:'雾',48:'雾',51:'雨',53:'雨',55:'雨',61:'雨',63:'雨',65:'雨',71:'雪',73:'雪',75:'雪',77:'雪',80:'雨',81:'雨',82:'雨',85:'雪',86:'雪',95:'雷',96:'雷',97:'雷'};

function save(k,v){try{localStorage.setItem('o_'+k,JSON.stringify(v));}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem('o_'+k));}catch(e){return null;}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ==== C1: Clock ====
function tick(){
  var n=new Date();
  document.getElementById('t').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2);
  document.getElementById('ms').textContent='.'+('00'+n.getMilliseconds()).slice(-3);
  document.getElementById('d').textContent=(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()];
  document.getElementById('lu').textContent='农历 '+lunarStr(n);
}
setInterval(tick,100);tick();

// Lunar
var LM=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var LD=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
var LI=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x16a95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0,0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,0x0d520];
function lunarDay(y,m,d){
  var i,leap=0,temp=0,offset=(Date.UTC(y,m,d)-Date.UTC(1900,0,31))/86400000;
  for(i=1900;i<2100&&offset>0;i++){temp=lunarYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var year=i,month=1,isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i==(leap+1)&&!isLeap){i--;isLeap=true;temp=leapMonthDays(year);}
    else{temp=monthDays(year,i,isLeap);isLeap=false;}
    if(isLeap&&i==(leap+1))isLeap=false;offset-=temp;
  }
  if(offset===0&&leap===i&&!isLeap)isLeap=true;
  if(offset<0)offset+=temp;month=i;
  return{year:year,month:month,day:offset+1,isLeap:isLeap};
}
function lunarYearDays(y){var i,s=348;for(i=0x8000;i>0x8;i>>=1){s+=(LI[y-1900]&i)?1:0;}return s+leapDays(y);}
function leapMonth(y){return LI[y-1900]&0xf;}
function leapDays(y){return leapMonth(y)?((LI[y-1900]&0x10000)?30:29):0;}
function leapMonthDays(y){return(LI[y-1900]&0x10000)?30:29;}
function monthDays(y,m,l){return l?leapMonthDays(y):((LI[y-1900]&(0x10000>>m))?30:29);}
function lunarStr(d){var l=lunarDay(d.getFullYear(),d.getMonth(),d.getDate());return(l.isLeap?'闰':'')+LM[l.month-1]+'月'+LD[l.day];}

// ==== C2: Weather ====
function fetchWx(){
  fetch(API+'/api/weather?lat=23.13&lon=113.26')
  .then(function(r){return r.json();})
  .then(function(w){
    if(!w||!w.current)return;
    save('wx',{d:w,ts:Date.now()});
    var c=w.current;
    document.getElementById('wt').textContent=Math.round(c.temperature_2m)+'°C';
    document.getElementById('wd').textContent=WX[c.weather_code]||'--';
    document.getElementById('wh').textContent='湿度'+(c.relative_humidity_2m||'--')+'%';

    var hh=w.hourly;
    if(hh&&hh.time){
      var cur=new Date().getHours(),off=[1,3,6],lab=['+1时','+3时','+6时'],h='';
      for(var i=0;i<off.length;i++){
        var idx=cur+off[i];if(idx>=hh.time.length)idx=hh.time.length-1;
        var code=hh.weather_code[idx],tmp=hh.temperature_2m[idx];
        var rain=hh.precipitation_probability?hh.precipitation_probability[idx]:0;
        h+='<div class="c2-i"><div class="l">'+lab[i]+'</div><div class="v">'+(WX[code]||'--')+' '+Math.round(tmp)+'°</div><div class="r">'+(rain>0?'雨'+rain+'%':'')+'</div></div>';
      }
      document.getElementById('wf').innerHTML=h;
    }

    // Geo
    fetch(API+'/api/geocode?lat=23.13&lon=113.26')
    .then(function(r){return r.json();})
    .then(function(d){
      var a=(d&&d.address)||d||{};
      var city=a.city||a.town||a.county||'';
      if(city){document.getElementById('ci').textContent=city;save('city',city);}
    }).catch(function(){});
  })
  .catch(function(){
    var c=load('wx');if(c&&Date.now()-c.ts<600000){
      var w=c.d.current;
      document.getElementById('wt').textContent=Math.round(w.temperature_2m)+'°C';
      document.getElementById('wd').textContent=WX[w.weather_code]||'--';
      document.getElementById('wh').textContent='湿度'+(w.relative_humidity_2m||'--')+'%';
    }
  });
}

// ==== C3: News ====
var ns=[],nsI=0;
function fetchNs(){
  fetch(API+'/api/news')
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d||!d.length)return;
    ns=d;nsI=0;save('news',{d:d,ts:Date.now()});
    showNews();
  })
  .catch(function(){
    var c=load('news');if(c&&c.d&&c.d.length){ns=c.d;showNews();}
  });
}
function showNews(){
  if(!ns.length){document.getElementById('nw').textContent='暂无新闻';return;}
  var item=ns[nsI];
  document.getElementById('nw').innerHTML='<span class="c3-s">['+item.source+']</span> '+esc(item.title);
  nsI=(nsI+1)%ns.length;
  setTimeout(showNews,20000);
}

// ==== C4: AI Brief ====
function fetchBf(){
  fetch(API+'/api/news-summary')
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d||!d.summary)return;
    save('brief',{s:d.summary,ts:Date.now()});
    renderMd(d.summary);
  })
  .catch(function(){
    var c=load('brief');if(c&&c.s)renderMd(c.s);
  });
}
function renderMd(md){
  var lines=md.split('\n'),html='',it=false;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(/^##\s/.test(l)){if(it){html+='</table>';it=false;}html+='<h2>'+l.replace(/^##\s*/,'')+'</h2>';continue;}
    if(/^###\s/.test(l)){if(it){html+='</table>';it=false;}html+='<h3>'+l.replace(/^###\s*/,'')+'</h3>';continue;}
    if(/^\|[-|\s]+\|$/.test(l))continue;
    if(/^\|/.test(l)&&/\|$/.test(l)){
      if(!it){html+='<table>';it=true;}
      var cs=l.split('|').filter(function(c){return c.length>0;});
      html+='<tr>';
      for(var j=0;j<cs.length;j++)html+='<td>'+cs[j].trim()+'</td>';
      html+='</tr>';continue;
    }
    if(it){html+='</table>';it=false;}
    if(l.trim()===''){html+='<br>';continue;}
    if(/^>\s/.test(l)){html+='<div class="kc"><p>'+l.replace(/^>\s*/,'')+'</p></div>';continue;}
    html+='<p>'+l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>';
  }
  if(it)html+='</table>';
  document.getElementById('bf').innerHTML=html||'暂无简报';
}

// ==== Init ====
(function(){
  // Restore cache
  var wc=load('wx');if(wc&&Date.now()-wc.ts<600000){
    var c=wc.d.current;
    document.getElementById('wt').textContent=Math.round(c.temperature_2m)+'°C';
    document.getElementById('wd').textContent=WX[c.weather_code]||'--';
    document.getElementById('wh').textContent='湿度'+(c.relative_humidity_2m||'--')+'%';
    // Build hourly from cache
    var hh=wc.d.hourly;
    if(hh&&hh.time){
      var cur=new Date().getHours(),off=[1,3,6],lab=['+1时','+3时','+6时'],h='';
      for(var i=0;i<off.length;i++){
        var idx=cur+off[i];if(idx>=hh.time.length)idx=hh.time.length-1;
        var code=hh.weather_code[idx],tmp=hh.temperature_2m[idx];
        var rain=hh.precipitation_probability?hh.precipitation_probability[idx]:0;
        h+='<div class="c2-i"><div class="l">'+lab[i]+'</div><div class="v">'+(WX[code]||'--')+' '+Math.round(tmp)+'°</div><div class="r">'+(rain>0?'雨'+rain+'%':'')+'</div></div>';
      }
      document.getElementById('wf').innerHTML=h;
    }
  }
  var nc=load('news');if(nc&&nc.d&&nc.d.length){ns=nc.d;showNews();}
  var bc=load('brief');if(bc&&bc.s)renderMd(bc.s);
  var cc=load('city');if(cc)document.getElementById('ci').textContent=cc;

  // Fetch fresh
  fetchWx();fetchNs();fetchBf();
  setInterval(fetchWx,600000);
  setInterval(fetchNs,600000);
  setInterval(fetchBf,900000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AI Nav 时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{font-family:sans-serif,sans-serif;background:#050510;color:rgba(255,255,255,.9);font-size:13px;line-height:1.4;display:flex;flex-direction:column;padding:8px 10px;-webkit-user-select:none;user-select:none}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 20%,rgba(0,210,255,.04) 0%,transparent 60%)}
.card{flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px 16px;margin-top:4px;position:relative;z-index:1;overflow:hidden}
.c1t{font-size:38px;font-weight:700;color:#fff;line-height:1}
.c1ms{font-size:14px;color:#00e5ff;opacity:.82;min-width:48px;display:inline-block;text-align:left}
.c1d{font-size:13px;color:rgba(255,255,255,.5);margin-top:2px}
.c1ci{font-size:10px;color:rgba(0,210,255,.35);margin-top:2px}
.lbl{font-size:9px;color:rgba(0,210,255,.4);font-weight:600;letter-spacing:.06em;margin-bottom:4px}
.wt{font-size:22px;font-weight:600;color:#fff}
.wd{font-size:11px;color:rgba(255,255,255,.5)}
.wh{font-size:9px;color:rgba(255,255,255,.22);margin-top:1px}
.wf{display:flex;margin-top:6px}
.wf>*+*{margin-left:6px}
.wi{flex:1;text-align:center;background:rgba(255,255,255,.02);border-radius:8px;padding:5px 3px;border:1px solid rgba(255,255,255,.04)}
.wi .l{font-size:9px;color:rgba(255,255,255,.28)}
.wi .v{font-size:15px;font-weight:600;color:#fff;margin:2px 0}
.nss{font-size:9px;color:#00e5ff;font-weight:700}
.nst{font-size:12px;color:rgba(255,255,255,.55);line-height:1.4;margin-top:3px}
.bf{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:80px;line-height:1.45;font-size:11px}
.bf h2{font-size:14px;font-weight:700;color:#fff;margin:8px 0 4px}
.bf h3{font-size:12px;font-weight:600;color:rgba(255,255,255,.75);margin:6px 0 3px}
.bf p{font-size:11px;color:rgba(255,255,255,.5);margin:3px 0}
.bf strong{color:#f59e0b}
.bf table{width:100%;border-collapse:collapse;margin:4px 0;font-size:10px}
.bf td,.bf th{border:1px solid rgba(255,255,255,.08);padding:3px 5px;text-align:left}
.bf th{background:rgba(0,210,255,.06);color:#00e5ff;font-size:10px}
.bf .kc{background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.1);border-radius:8px;padding:8px 10px;margin:5px 0}
</style></head><body>
<div class="bg"></div>

<div class="card"><div class="c1t"><span id="t">--:--:--</span><span class="c1ms" id="ms">.--</span></div><div class="c1d" id="d">--</div><div class="c1ci" id="ci">广州</div></div>

<div class="card"><div class="lbl">天气</div><div class="wt" id="wt">--°</div><div class="wd" id="wd">加载中</div><div class="wh" id="wh"></div><div class="wf" id="wf"></div></div>

<div class="card"><div class="lbl">快讯</div><div class="nss" id="nss">加载中</div><div class="nst" id="nst"></div></div>

<div class="card bf" id="bfc">AI 简报加载中</div>

<script>
var A='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var WN={0:'晴天',1:'少云',2:'多云',3:'阴天',45:'雾',48:'霜雾',51:'小雨',53:'小雨',55:'中雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',77:'雪',80:'阵雨',81:'阵雨',82:'暴雨',85:'阵雪',86:'阵雪',95:'雷暴',96:'雷暴',97:'强雷暴'};

// Clock ONLY — no lunar
function tick(){var n=new Date();document.getElementById('t').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2);document.getElementById('ms').textContent='.'+('00'+n.getMilliseconds()).slice(-3);document.getElementById('d').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日'}setInterval(tick,80);tick();

// Weather
fetch(A+'/api/weather?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(w){var c=w.current;document.getElementById('wt').textContent=Math.round(c.temperature_2m)+'°C';document.getElementById('wd').textContent=WN[c.weather_code]||'';document.getElementById('wh').textContent='湿度 '+(c.relative_humidity_2m||'')+'%';var hh=w.hourly;if(hh&&hh.time){var cur=(new Date()).getHours(),h='';for(var i=0;i<3;i++){var idx=cur+[1,3,6][i];if(idx>=hh.time.length)idx=hh.time.length-1;h+='<div class="wi"><div class="l">'+['+1时','+3时','+6时'][i]+'</div><div class="v">'+Math.round(hh.temperature_2m[idx])+'°</div></div>'}document.getElementById('wf').innerHTML=h}fetch(A+'/api/geocode?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(d){var a=(d&&d.address)||d||{};var c=a.city||a.town||a.county||'';if(c)document.getElementById('ci').textContent=c})});

// News
var nsI=0,nsD=[];
fetch(A+'/api/news').then(function(r){return r.json()}).then(function(d){if(!d||!d.length)return;nsD=d;showNs()});
function showNs(){if(!nsD.length)return;var it=nsD[nsI];document.getElementById('nss').textContent=it.source||'';document.getElementById('nst').textContent=it.title||'';nsI=(nsI+1)%nsD.length;setTimeout(showNs,20000)}

// Brief
fetch(A+'/api/news-summary').then(function(r){return r.json()}).then(function(d){if(!d||!d.summary)return;var ls=d.summary.split('\n'),h='';for(var i=0;i<ls.length;i++){var l=ls[i];h+='<p>'+l+'</p>'}document.getElementById('bfc').innerHTML=h});
</script>
</body></html>

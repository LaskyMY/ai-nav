<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AI Nav 看板</title>
<style>
:root{--bg:#0a0a0f;--a1:#6366f1;--pink:#ec4899;--vio:#a855f7;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#0d0d1a 0%,#090911 50%,#0c0c1e 100%);color:rgba(255,255,255,.9);font-family:-apple-system,sans-serif;font-size:12px;line-height:1.4;padding:calc(48px + var(--sat)) 6px calc(24px + var(--sab)) 6px;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
.bg__orb{position:fixed;border-radius:50%;filter:blur(140px);opacity:.4;pointer-events:none;z-index:0}
.bg__orb:nth-child(1){width:420px;height:420px;background:radial-gradient(circle,var(--a1) 0%,transparent 70%);top:-25%;left:-20%;animation:fo 24s ease-in-out infinite}
.bg__orb:nth-child(2){width:320px;height:320px;background:radial-gradient(circle,var(--pink) 0%,transparent 70%);bottom:-20%;right:-15%;animation:fo 28s ease-in-out infinite reverse}
.bg__orb:nth-child(3){width:260px;height:260px;background:radial-gradient(circle,var(--vio) 0%,transparent 70%);top:55%;left:60%;animation:fo 22s ease-in-out infinite;animation-delay:-10s}
@keyframes fo{0%,100%{transform:translate(0,0)scale(1)}33%{transform:translate(35px,-35px)scale(1.1)}66%{transform:translate(-25px,20px)scale(.9)}}
.glow-spot{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle 450px at 50% 50%,rgba(99,102,241,.05),rgba(236,72,153,.03) 25%,transparent 65%)}
.g{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-flow:dense;grid-auto-rows:minmax(46px,auto);gap:5px;align-content:start;overflow-y:auto;-webkit-overflow-scrolling:touch}
.c{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:10px 12px;backdrop-filter:saturate(180%)blur(40px);-webkit-backdrop-filter:saturate(180%)blur(40px);box-shadow:rgba(255,255,255,.02)0 0 0 1px,rgba(0,0,0,.25)0 6px 20px;position:relative;overflow:hidden;transition:background .8s ease,border-color .8s ease;min-height:40px}
.c::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.03)0%,transparent 35%,transparent 65%,rgba(255,255,255,.01)100%);pointer-events:none}
.c.l1{border-color:rgba(239,68,68,.06);background:rgba(239,68,68,.025);box-shadow:rgba(239,68,68,.03)0 0 0 1px,rgba(0,0,0,.25)0 6px 20px}
.c.l2{border-color:rgba(245,158,11,.05);background:rgba(245,158,11,.02);box-shadow:rgba(245,158,11,.025)0 0 0 1px,rgba(0,0,0,.25)0 6px 20px}
.c.l3{border-color:rgba(100,160,255,.04)}
.c.lX{border-color:rgba(255,255,255,.05)}
.c3{grid-column:span 3}.c2{grid-column:span 2}
.tt{font-size:1.05em;font-weight:600;color:rgba(255,255,255,.88);line-height:1.3;margin-bottom:3px}
.ts{font-size:.9em;color:rgba(255,255,255,.5);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.tm{font-size:.75em;color:rgba(255,255,255,.3);margin-top:auto;padding-top:4px}
.k1{color:#818cf8;font-weight:700}.k2{color:#fbbf24;font-weight:700}.k3{color:#f87171;font-weight:700}
/* Clock */
.ckb{font-size:64px;font-weight:700;background:linear-gradient(135deg,var(--a1),var(--pink));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;text-align:center;animation:gf 4s ease-in-out infinite}
@keyframes gf{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.ckms{font-size:22px;color:#818cf8;-webkit-text-fill-color:#818cf8;font-weight:500;display:inline-block}
.ckd{font-size:10px;text-align:center;color:rgba(255,255,255,.3);margin-top:3px}
/* Weather */
.wt{font-size:38px;font-weight:700;text-align:center}
.wd{font-size:10px;color:rgba(255,255,255,.4);text-align:center;margin-top:2px}
.wxh{font-size:9px;color:rgba(255,255,255,.2);text-align:center;margin-top:1px}
/* Typewriter pulse */
.tw{animation:tw .35s steps(2)}.tw-r{opacity:.4}
@keyframes tw{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)hue-rotate(2deg)}}
</style>
</head><body>
<div class="bg__orb"></div><div class="bg__orb"></div><div class="bg__orb"></div>
<div class="glow-spot"></div>
<div class="g" id="g"></div>
<script>
var A='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var WI={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌧️',53:'🌧️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌦️',82:'🌦️',95:'⛈️',96:'⛈️',97:'⛈️'};
var WN={0:'晴天',1:'少云',2:'多云',3:'阴天',45:'雾',48:'霜雾',51:'小雨',53:'小雨',55:'中雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',77:'雪',80:'阵雨',81:'阵雨',82:'暴雨',85:'阵雪',86:'阵雪',95:'雷暴',96:'雷暴',97:'强雷暴'};
var ns=[],wxPages=[],wxI=0,wxT=null;

function em(t){var s=(t||'').toLowerCase();if(/战争|冲突|空袭|军事|导弹|军队|武器|袭击|打击/.test(t))return'💥';if(/经济|市场|股票|金融|利率|美元|货币|通胀|贸易/.test(t))return'📈';if(/政治|选举|总统|国会|政府|法律|法院|谈判|外交/.test(t))return'🏛️';if(/科技|AI|芯片|数据|网络|智能|模型|算法/.test(t))return'🧠';if(/健康|医疗|疾病|药物|疫苗|病毒|疫情|癌症/.test(t))return'💊';if(/气候|环境|能源|自然|灾害|地震|天气|洪水|干旱/.test(t))return'🌀';if(/体育|比赛|运动|足球|篮球|NBA|冠军/.test(t))return'🏆';if(/死亡|遇难|丧生|杀害|事故/.test(t))return'🕯️';if(/抗议|示威|游行|罢工/.test(t))return'✊';if(/协议|合作|签署|达成/.test(t))return'🤝';if(/移民|难民|边境/.test(t))return'🚶';if(/能源|石油|天然气|电力/.test(t))return'⚡';if(/教育|学校|学生|大学/.test(t))return'📚';return'📡'}

function kw(t,k){if(!k||!t)return t;var s=t,ks=k.split(',');for(var i=0;i<ks.length;i++){var w=ks[i].trim();if(!w)continue;var c='k1';if(w[0]==='!'){c='k3';w=w.slice(1)}else if(w[0]==='*'){c='k2';w=w.slice(1)}s=s.split(w).join('<span class="'+c+'">'+w+'</span>')}return s}

function build(){
  var h='';h+='<div class="c c3 lX"><div class="ckb" id="t">--:--:--<span class="ckms">.---</span></div><div class="ckd" id="td">----</div></div>';
  h+='<div class="c c2 lX" id="wc"><div style="text-align:center;padding:6px 0"><div style="font-size:34px;margin-bottom:2px" id="wxi">☀️</div><div style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:2px"><span id="ci">广州</span> · <span id="wxl">当前</span></div><div style="font-size:18px;font-weight:600;color:#fff" id="wxt">--°</div><div class="wxh" id="wxh">天气加载中</div></div>';
  h+='<div class="c c2 lX"><div class="tt">📡 实时信息</div><div class="ts">数据: <span id="ot">加载中</span></div><div class="tm">下次刷新: <span id="nx">--</span></div></div>';
  for(var i=0;i<ns.length;i++){var n=ns[i],lv=n.level==='critical'?'1':n.level==='high'?'2':n.level==='low'?'4':'3';h+='<div class="c l'+lv+(i<2?' c2':'')+'" data-id="n'+i+'"><div class="tt">'+em(n.title)+' '+kw(n.title,n.keywords)+'</div>'+(n.summary?'<div class="ts">'+kw(n.summary,n.keywords)+'</div>':'')+(n.metric?'<div class="tm">'+n.metric+'</div>':'')+'</div>'}
  document.getElementById('g').innerHTML=h;tick()
}

function tick(){var n=new Date(),el=document.getElementById('t');if(el)el.innerHTML=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2)+' <span class="ckms">.'+('00'+n.getMilliseconds()).slice(-3)+'</span>';el=document.getElementById('td');if(el)el.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()];requestAnimationFrame(tick)}requestAnimationFrame(tick);

function startWx(){wxI=0;showWx(0);wxT=setInterval(function(){wxI=(wxI+1)%wxPages.length;showWx(wxI)},5000)}
function showWx(i){var p=wxPages[i];var wxi=document.getElementById('wxi');if(wxi)wxi.textContent=WI[p.code]||'☀️';var wxl=document.getElementById('wxl');if(wxl)wxl.textContent=p.label;var wxt=document.getElementById('wxt');if(wxt)wxt.textContent=p.temp+'°C';var wxh=document.getElementById('wxh');if(wxh)wxh.textContent=WN[p.code]||'';var ci=document.getElementById('ci');if(ci&&p.city)ci.textContent=p.city}

// Weather with 5s timeout
var wxDone=false;
setTimeout(function(){if(!wxDone){wxDone=true;wxPages=[{label:'当前',temp:'27',code:0},{label:'+1 小时',temp:'28',code:1},{label:'+3 小时',temp:'30',code:0},{label:'+6 小时',temp:'26',code:2}];if(!ns.length)build();startWx()}},5000);
fetch(A+'/api/weather?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(w){if(wxDone)return;wxDone=true;var c=w.current,hh=w.hourly;wxPages=[{label:'当前',temp:Math.round(c.temperature_2m),code:c.weather_code}];if(hh&&hh.time){var cur=(new Date()).getHours();for(var i=0;i<3;i++){var idx=cur+[1,3,6][i];if(idx>=hh.time.length)idx=hh.time.length-1;wxPages.push({label:'+'+(i*2+1)+'小时',temp:Math.round(hh.temperature_2m[idx]),code:hh.weather_code[idx]})}}if(!ns.length)build();startWx();fetch(A+'/api/geocode?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(d){var a=(d&&d.address)||d||{},cc=a.city||a.town||a.county||'';if(cc)document.getElementById('ci').textContent=cc})}).catch(function(){if(!wxDone){wxDone=true;wxPages=[{label:'当前·广州',temp:'27',code:0},{label:'+1时',temp:'28',code:1},{label:'+3时',temp:'30',code:0},{label:'+6时',temp:'26',code:2}];if(!ns.length)build();startWx()}});

// News with 5s timeout
var nsDone=false;
setTimeout(function(){if(!nsDone){nsDone=true;ns=[{level:'high',title:'国际要闻',summary:'AI 正在整理今日新闻，请稍候',metric:'DeepSeek V3',keywords:''},{level:'normal',title:'实时快讯',summary:'新闻流即将就绪',metric:'NPR',keywords:''}];
  var otEl2=document.getElementById('ot');if(otEl2)otEl2.textContent='正在加载AI摘要...';
  var nxEl2=document.getElementById('nx');if(nxEl2)nxEl2.textContent='等待首次同步';build()}},5000);
fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){if(nsDone)return;nsDone=true;if(!d||!d.length)return;ns=d;
  var now=new Date(),nx=new Date(now.getTime()+600000);
  var otEl=document.getElementById('ot'),nxEl=document.getElementById('nx');
  if(otEl)otEl.textContent=now.toLocaleTimeString('zh-CN')+' 更新 · '+ns.length+'条';
  if(nxEl)nxEl.textContent='下次: '+nx.toLocaleTimeString('zh-CN');
  build();
  fetch(A+'/api/news-summary').then(function(r){return r.json()}).then(function(s){
    if(s&&s.summary){var d2=s.summary;if(d2.indexOf('##')>=0){var ls2=d2.split(/\n(?=## )/);d2=ls2[0].replace(/^##\s*/,'')}document.getElementById('ot').textContent=d2.slice(0,60)}
  }).then(function(r){return r.json()}).then(function(s){if(s&&s.summary){var ls=s.summary.split('\n').filter(function(l){return l.trim()&&!/^##/.test(l)});document.getElementById('ot').textContent=ls.slice(0,3).join(' · ')}})})['catch'](function(e){if(!nsDone){nsDone=true;ns=[{level:'high',title:'网络连接异常',summary:'请检查网络后刷新',metric:'',keywords:''}];build()}});

// Typewriter flash — character-by-character within 3s
function typeEl(el,html,done){
  if(!el)return;if(el.innerHTML===html){if(done)done();return}
  el.classList.add('tw-r');el.innerHTML='';
  // Feed formatted HTML word by word (split on spaces/tags boundaries)
  var parts=html.split(/(<[^>]+>|\s+)/).filter(function(p){return p.length});
  var i=0,total=parts.length,ms=Math.min(2800/total,30);
  function step(){
    if(i>=total){el.innerHTML=html;el.classList.remove('tw-r');el.classList.add('tw');setTimeout(function(){el.classList.remove('tw')},300);if(done)done();return}
    el.innerHTML=parts.slice(0,i+1).join('');i++;setTimeout(step,ms*(.7+Math.random()*.6));
  }
  step();
}
setTimeout(function twFlash(){
  var els=document.querySelectorAll('[data-id^="n"]');if(!els.length){setTimeout(twFlash,2000);return}
  var pool=[];for(var i=0;i<els.length;i++){var lv=ns[i]?ns[i].level:'normal';var w=lv==='low'?5:lv==='normal'?3:lv==='high'?2:1;for(var j=0;j<w;j++)pool.push(i)}
  var idx=pool[Math.floor(Math.random()*pool.length)],el=els[idx];if(!el){setTimeout(twFlash,800);return}
  var others=ns.filter(function(x,i){return i!==idx});var src=others.length?others[Math.floor(Math.random()*others.length)]:ns[idx];
  var ti=el.querySelector('.tt');if(ti&&src)typeEl(ti,em(src.title)+' '+kw(src.title,src.keywords));
  var si=el.querySelector('.ts');if(si){var s=src.summary||'';if(s)typeEl(si,kw(s,src.keywords))}
  setTimeout(twFlash,1500+Math.random()*2500);
},3000);

// Mouse glow
var gs=document.querySelector('.glow-spot'),rf;document.addEventListener('mousemove',function(e){if(!rf){rf=requestAnimationFrame(function(){gs.style.background='radial-gradient(circle 450px at '+e.clientX+'px '+e.clientY+'px,rgba(99,102,241,.06),rgba(236,72,153,.04)25%,transparent 65%)';rf=null})}},{passive:true});document.addEventListener('touchmove',function(e){var t=e.touches[0];gs.style.background='radial-gradient(circle 450px at '+t.clientX+'px '+t.clientY+'px,rgba(99,102,241,.06),rgba(236,72,153,.04)25%,transparent 65%)'},{passive:true});
</script>
</body></html>

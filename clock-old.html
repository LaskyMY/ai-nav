<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI Nav · 时钟面板</title>
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
font-family:'Roboto',sans-serif;
background:#0a0a14;color:rgba(255,255,255,.88);
display:flex;flex-direction:column;align-items:center;
-webkit-user-select:none;user-select:none;
-webkit-tap-highlight-color:transparent;
}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse at 50% 25%,rgba(0,210,255,.045) 0%,transparent 55%),
           radial-gradient(ellipse at 30% 65%,rgba(138,43,226,.03) 0%,transparent 50%);}

/* ===== Dot indicators ===== */
.dots{flex-shrink:0;display:flex;justify-content:center;z-index:10;padding:10px 0 6px;}
.dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin:0 5px;transition:width .35s ease,background .35s ease;}
.dot.act{width:18px;background:rgba(0,210,255,.7);box-shadow:0 0 8px rgba(0,210,255,.25);}

/* ===== Card stage ===== */
.stage{flex:1;width:100%;position:relative;z-index:5;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.card-wrap{position:absolute;width:92%;max-width:380px;
transition:transform .55s cubic-bezier(.25,.8,.25,1),opacity .55s ease;
will-change:transform,opacity;
}
.card-wrap.above{transform:translateY(-110%);opacity:0;pointer-events:none;}
.card-wrap.center{transform:translateY(0);opacity:1;pointer-events:auto;}
.card-wrap.below{transform:translateY(110%);opacity:0;pointer-events:none;}
.card-wrap.hidden{display:none;}

/* ===== Card body ===== */
.c{background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.06);border-radius:14px;
padding:14px 16px;position:relative;overflow:hidden;
box-shadow:0 4px 24px rgba(0,0,0,.25);}
.c::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;
background:linear-gradient(135deg,rgba(255,255,255,.015) 0%,transparent 40%);pointer-events:none;}

/* Expand "+" button */
.c-xp{position:absolute;top:6px;right:10px;width:24px;height:24px;border-radius:12px;
background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.45);
font-size:14px;line-height:22px;text-align:center;cursor:pointer;z-index:2;
transition:transform .35s ease,background .25s;}
.c-xp:active{background:rgba(255,255,255,.12);}
.c-xp.open{transform:rotate(45deg);}

/* ===== Card 1: Clock ===== */
.c1-time{font-size:52px;font-weight:700;letter-spacing:.02em;color:#fff;
text-shadow:0 0 30px rgba(0,210,255,.28);line-height:1.05;text-align:center;}
.c1-ms{font-size:20px;font-weight:600;color:#00d2ff;min-width:52px;display:inline-block;text-align:left;opacity:.82;}
.c1-date{text-align:center;font-size:13px;color:rgba(255,255,255,.55);margin-top:6px;font-weight:500;}
.c1-lunar{text-align:center;font-size:12px;color:rgba(255,255,255,.32);margin-top:3px;}
.c1-city{text-align:center;font-size:11px;color:rgba(0,210,255,.4);margin-top:4px;}

/* ===== Card 2: Weather ===== */
.c2-now{display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.c2-temp{font-size:40px;font-weight:600;color:#fff;}
.c2-info{margin-left:10px;}
.c2-desc{font-size:14px;color:rgba(255,255,255,.6);}
.c2-hum{font-size:12px;color:rgba(255,255,255,.32);margin-top:2px;}
.c2-hourly{display:flex;justify-content:center;}
.c2-h{flex:1;text-align:center;background:rgba(255,255,255,.025);border-radius:8px;padding:6px 4px;margin:0 3px;border:1px solid rgba(255,255,255,.04);}
.c2-h .hdr{font-size:9px;color:rgba(255,255,255,.28);margin-bottom:3px;}
.c2-h .wx{font-size:14px;font-weight:600;color:rgba(255,255,255,.75);}
.c2-h .tmp{font-size:12px;font-weight:600;color:#fff;margin-top:2px;}
.c2-h .rain{font-size:9px;color:rgba(0,210,255,.55);margin-top:1px;}

/* ===== Card 3: News ===== */
.c3-title{font-size:13px;font-weight:700;color:#00d2ff;margin-bottom:8px;}
.c3-item{font-size:11px;color:rgba(255,255,255,.6);padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.45;}
.c3-tag{font-size:9px;color:#00d2ff;font-weight:600;margin-right:4px;}
.c3-pg{text-align:center;font-size:10px;color:rgba(255,255,255,.2);margin-top:8px;}

/* ===== Card 4: AI Brief ===== */
.c4 h2{font-size:14px;font-weight:700;color:#fff;margin:8px 0 4px;}
.c4 h3{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);margin:6px 0 3px;}
.c4 p{font-size:11px;color:rgba(255,255,255,.5);margin:3px 0;line-height:1.5;}
.c4 strong{color:#f0a020;font-weight:600;}
.c4 table{width:100%;border-collapse:collapse;margin:4px 0;font-size:10px;}
.c4 td,.c4 th{border:1px solid rgba(255,255,255,.08);padding:3px 5px;text-align:left;}
.c4 th{background:rgba(0,210,255,.06);color:#00d2ff;font-size:10px;}
.c4 .kc{background:rgba(138,43,226,.06);border:1px solid rgba(138,43,226,.1);border-radius:8px;padding:8px 10px;margin:5px 0;}
.c4 .kc p{color:rgba(255,255,255,.6);}

/* ===== Floating refresh ===== */
.fab{position:fixed;bottom:16px;right:16px;z-index:100;
width:40px;height:40px;border-radius:20px;
background:rgba(0,210,255,.1);border:1px solid rgba(0,210,255,.18);
display:flex;align-items:center;justify-content:center;cursor:pointer;
transition:transform .3s ease,background .2s;
box-shadow:0 2px 12px rgba(0,0,0,.3);}
.fab:active{transform:scale(.9);background:rgba(0,210,255,.18);}
.fab svg{width:18px;height:18px;stroke:#00d2ff;fill:none;stroke-width:2;}
.fab.spin svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Loading ===== */
.ld{display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,.1);border-top-color:#00d2ff;border-radius:50%;
animation:spin .6s linear infinite;vertical-align:middle;margin:0 3px;}

/* ===== Top bar ===== */
.topbar{flex-shrink:0;text-align:center;padding:10px 0 4px;z-index:10;}
.topbar span{font-size:9px;color:rgba(255,255,255,.15);letter-spacing:.1em;}
</style>
</head>
<body>
<div class="bg"></div>

<div class="topbar"><span>AI NAV · 时钟面板</span></div>

<!-- Dot indicators -->
<div class="dots" id="dots">
  <span class="dot act" data-i="0"></span>
  <span class="dot" data-i="1"></span>
  <span class="dot" data-i="2"></span>
  <span class="dot" data-i="3"></span>
</div>

<!-- Card stage -->
<div class="stage" id="stage">
  <!-- Card 1: Clock -->
  <div class="card-wrap center" data-card="0">
    <div class="c">
      <span class="c-xp" onclick="toggleExpand(this)" title="展开">+</span>
      <div class="c1-time"><span id="hms">--:--:--</span><span class="c1-ms" id="ms">.--</span></div>
      <div class="c1-date" id="c1date">--月--日 周-</div>
      <div class="c1-lunar" id="c1lunar">农历 ----</div>
      <div class="c1-city" id="c1city">广州</div>
    </div>
  </div>

  <!-- Card 2: Weather -->
  <div class="card-wrap below" data-card="1">
    <div class="c">
      <span class="c-xp" onclick="toggleExpand(this)" title="展开">+</span>
      <div class="c2-now"><span class="c2-temp" id="c2temp">--°</span><span class="c2-info"><div class="c2-desc" id="c2desc">--</div><div class="c2-hum" id="c2hum">湿度 --%</div></span></div>
      <div class="c2-hourly" id="c2hourly"></div>
    </div>
  </div>

  <!-- Card 3: News -->
  <div class="card-wrap below" data-card="2">
    <div class="c">
      <span class="c-xp" onclick="toggleExpand(this)" title="展开">+</span>
      <div class="c3-title">新闻速览</div>
      <div id="c3list"><div class="c3-item">加载中<span class="ld"></span></div></div>
      <div class="c3-pg" id="c3pg"></div>
    </div>
  </div>

  <!-- Card 4: AI Brief -->
  <div class="card-wrap below" data-card="3">
    <div class="c" style="max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;">
      <span class="c-xp" onclick="toggleExpand(this)" title="展开">+</span>
      <div class="c4" id="c4">AI 简报生成中<span class="ld"></span></div>
    </div>
  </div>
</div>

<!-- Floating refresh -->
<div class="fab" id="fab" onclick="doRefresh()">
  <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
</div>

<script>
// ===== fetchWithTimeout =====
function fetchWithTimeout(url,ms){
  return new Promise(function(resolve,reject){
    var t=setTimeout(function(){reject(new Error('timeout'));},ms);
    fetch(url).then(function(r){clearTimeout(t);resolve(r);},function(e){clearTimeout(t);reject(e);});
  });
}

var API='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var curCard=0,TOTAL=4,autoTimer=null,autoDelay=12000;
var WX={0:'晴',1:'多云',2:'阴',3:'阴',45:'雾',48:'雾',51:'雨',53:'雨',55:'雨',61:'雨',63:'雨',65:'雨',71:'雪',73:'雪',75:'雪',77:'雪',80:'雨',81:'雨',82:'雨',85:'雪',86:'雪',95:'雷',96:'雷',97:'雷'};

function save(k,v){try{localStorage.setItem('oc_'+k,JSON.stringify(v));}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem('oc_'+k));}catch(e){return null;}}

// ===== Cache clear =====
function doRefresh(){
  var fab=document.getElementById('fab');fab.classList.add('spin');
  localStorage.removeItem('oc_wx');localStorage.removeItem('oc_news');localStorage.removeItem('oc_brief');
  fetchWeather();fetchNews();fetchBrief();
  setTimeout(function(){fab.classList.remove('spin');},1500);
}

// ===== Card rotation =====
function goCard(i,dir){
  if(i===curCard)return;
  var wraps=document.querySelectorAll('.card-wrap');
  var oldW=wraps[curCard],newW=wraps[i];
  if(!oldW||!newW)return;

  var clsOut=dir>0?'above':'below',clsIn=dir<0?'above':'below';
  oldW.className='card-wrap '+clsOut;
  newW.className='card-wrap center';
  for(var j=0;j<wraps.length;j++){if(j!==i&&j!==curCard)wraps[j].className='card-wrap hidden';}
  curCard=i;
  updateDots();
  resetAuto();
}

function goNext(){var n=(curCard+1)%TOTAL;goCard(n,1);}
function goPrev(){var n=(curCard-1+TOTAL)%TOTAL;goCard(n,-1);}

function updateDots(){
  var dots=document.querySelectorAll('.dot');
  for(var i=0;i<dots.length;i++)dots[i].className='dot'+(i===curCard?' act':'');
}

function resetAuto(){
  if(autoTimer)clearTimeout(autoTimer);
  autoTimer=setTimeout(goNext,autoDelay);
}

// ===== Expand/Collapse =====
function toggleExpand(el){
  el.classList.toggle('open');
  var card=el.parentElement;
  if(el.classList.contains('open')){
    card.style.maxHeight='none';
    card.style.overflow='visible';
  }else{
    card.style.maxHeight='';
    card.style.overflow='';
  }
}

// ===== Touch swipe =====
(function(){
  var startY=0,startX=0;
  document.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;startX=e.touches[0].clientX;},false);
  document.addEventListener('touchend',function(e){
    var dy=e.changedTouches[0].clientY-startY;
    var dx=e.changedTouches[0].clientX-startX;
    if(Math.abs(dy)<40||Math.abs(dy)<Math.abs(dx))return;
    if(dy>50)goPrev();else if(dy<-50)goNext();
  },false);
})();

// ===== Tap dots =====
document.getElementById('dots').addEventListener('click',function(e){
  var d=e.target.closest('.dot');if(!d)return;
  var i=parseInt(d.getAttribute('data-i'));if(i!==curCard)goCard(i,i>curCard?1:-1);
});

// ===== Lunar =====
var LU_M=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var LU_D=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
var LU_INFO=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x16a95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0,0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,0x0d520];

function lunarDay(y,m,d){
  var i,leap=0,temp=0,offset=(Date.UTC(y,m,d)-Date.UTC(1900,0,31))/86400000;
  for(i=1900;i<2100&&offset>0;i++){temp=lunarYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var year=i,month=1,isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i==(leap+1)&&!isLeap){i--;isLeap=true;temp=leapMonthDays(year);}
    else{temp=monthDays(year,i,isLeap);isLeap=false;}
    if(isLeap&&i==(leap+1))isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap===i&&!isLeap)isLeap=true;
  if(offset<0)offset+=temp;
  month=i;
  return{year:year,month:month,day:offset+1,isLeap:isLeap};
}
function lunarYearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1){sum+=(LU_INFO[y-1900]&i)?1:0;}return sum+leapDays(y);}
function leapMonth(y){return LU_INFO[y-1900]&0xf;}
function leapDays(y){return leapMonth(y)?((LU_INFO[y-1900]&0x10000)?30:29):0;}
function leapMonthDays(y){return(LU_INFO[y-1900]&0x10000)?30:29;}
function monthDays(y,m,isLeap){return isLeap?leapMonthDays(y):((LU_INFO[y-1900]&(0x10000>>m))?30:29);}
function lunarStr(d){
  var l=lunarDay(d.getFullYear(),d.getMonth(),d.getDate());
  return (l.isLeap?'闰':'')+LU_M[l.month-1]+'月'+LU_D[l.day];
}
function weekdayStr(d){return['日','一','二','三','四','五','六'][d.getDay()];}

// ===== Card 1: Clock update =====
function updateClock(){
  var n=new Date();
  document.getElementById('hms').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2);
  document.getElementById('ms').textContent='.'+('00'+n.getMilliseconds()).slice(-3);
  document.getElementById('c1date').textContent=(n.getMonth()+1)+'月'+n.getDate()+'日 周'+weekdayStr(n);
  document.getElementById('c1lunar').textContent='农历 '+lunarStr(n);
}
setInterval(updateClock,80);
updateClock();

// ===== Card 2: Weather =====
function fetchWeather(){
  fetchWithTimeout(API+'/api/geocode?lat=23.13&lon=113.26',4000)
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d)return;
      var a=d.address||d,c=a.city||a.town||a.county||a.state||'';
      if(c){document.getElementById('c1city').textContent=c;save('city',c);}
    }).catch(function(){});

  fetchWithTimeout(API+'/api/weather?lat=23.13&lon=113.26',8000)
    .then(function(r){return r.ok?r.json():null;})
    .then(function(w){
      if(!w||!w.current)throw new Error('no data');
      save('wx',{d:w,ts:Date.now()});
      renderWeather(w);
    }).catch(function(){
      var c=load('wx');
      if(c&&Date.now()-c.ts<600000)renderWeather(c.d);
    });
}

function renderWeather(w){
  var c=w.current;
  document.getElementById('c2temp').textContent=Math.round(c.temperature_2m)+'°C';
  document.getElementById('c2desc').textContent=WX[c.weather_code]||'--';
  document.getElementById('c2hum').textContent='湿度 '+(c.relative_humidity_2m||'--')+'%';

  var hh=w.hourly;
  if(hh&&hh.time){
    var cur=new Date().getHours(),off=[1,3,6],lab=['+1时','+3时','+6时'],h='';
    for(var i=0;i<off.length;i++){
      var idx=cur+off[i];if(idx>=hh.time.length)idx=hh.time.length-1;
      var code=hh.weather_code[idx],tmp=hh.temperature_2m[idx];
      var rain=hh.precipitation_probability?hh.precipitation_probability[idx]:0;
      h+='<div class="c2-h"><div class="hdr">'+lab[i]+'</div><div class="wx">'+(WX[code]||'--')+'</div><div class="tmp">'+Math.round(tmp)+'°</div><div class="rain">'+(rain>0?'雨'+rain+'%':'')+'</div></div>';
    }
    document.getElementById('c2hourly').innerHTML=h;
  }
}

// ===== Card 3: News =====
var nsCur=0,nsPageSize=4;
function fetchNews(){
  fetchWithTimeout(API+'/api/news',8000)
    .then(function(r){return r.ok?r.json():[];})
    .then(function(d){
      if(d&&d.length){save('news',{d:d,ts:Date.now()});renderNews(d);}
      else{var c=load('news');if(c&&c.d)renderNews(c.d);}
    }).catch(function(){
      var c=load('news');if(c&&c.d)renderNews(c.d);
    });
}

function renderNews(data){
  if(!data||!data.length){document.getElementById('c3list').innerHTML='<div class="c3-item">暂无新闻</div>';return;}
  var total=data.length,pages=Math.ceil(total/nsPageSize);
  var start=nsCur*nsPageSize,end=Math.min(start+nsPageSize,total);
  var html='';
  for(var i=start;i<end;i++)html+='<div class="c3-item"><span class="c3-tag">['+data[i].source+']</span>'+esc(data[i].title)+'</div>';
  document.getElementById('c3list').innerHTML=html;
  document.getElementById('c3pg').textContent=(nsCur+1)+'/'+pages+' (每'+(autoDelay/1000)+'秒自动翻页)';
  nsCur=(nsCur+1)%pages;
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ===== Card 4: AI Brief =====
function fetchBrief(){
  fetchWithTimeout(API+'/api/news-summary',8000)
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d||!d.summary)return;
      save('brief',{s:d.summary,ts:Date.now()});
      renderBrief(d.summary);
    }).catch(function(){
      var c=load('brief');if(c&&c.s)renderBrief(c.s);
    });
}

function renderBrief(md){
  var lines=md.split('\n'),html='',inTable=false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^##\s/.test(line)){if(inTable){html+='</table>';inTable=false;}html+='<h2>'+line.replace(/^##\s*/,'')+'</h2>';continue;}
    if(/^###\s/.test(line)){if(inTable){html+='</table>';inTable=false;}html+='<h3>'+line.replace(/^###\s*/,'')+'</h3>';continue;}
    if(/^\|[-|\s]+\|$/.test(line))continue;
    if(/^\|/.test(line)&&/\|$/.test(line)){
      if(!inTable){html+='<table>';inTable=true;}
      var cells=line.split('|').filter(function(c){return c.length>0;});
      html+='<tr>';
      for(var j=0;j<cells.length;j++)html+='<td>'+cells[j].trim()+'</td>';
      html+='</tr>';continue;
    }
    if(inTable){html+='</table>';inTable=false;}
    if(line.trim()===''){html+='<br>';continue;}
    if(/^>\s/.test(line)){html+='<div class="kc"><p>'+line.replace(/^>\s*/,'')+'</p></div>';continue;}
    html+='<p>'+line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>';
  }
  if(inTable)html+='</table>';
  document.getElementById('c4').innerHTML=html||'暂无简报';
}

// ===== Init =====
(function init(){
  // Restore cached
  var c=load('wx');if(c&&Date.now()-c.ts<600000)renderWeather(c.d);
  var cn=load('news');if(cn&&cn.d)renderNews(cn.d);
  var cb=load('brief');if(cb&&cb.s)renderBrief(cb.s);
  var cc=load('city');if(cc)document.getElementById('c1city').textContent=cc;

  fetchWeather();fetchNews();fetchBrief();
  setInterval(fetchWeather,600000);
  setInterval(fetchNews,300000);
  setInterval(fetchBrief,900000);
  resetAuto();
})();
</script>

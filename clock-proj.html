<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AI Nav 看板 · iOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{background:#0a0a0f;color:#f0f0f5;font-family:-apple-system,sans-serif;font-size:12px;line-height:1.35;padding:50px 6px 26px 6px;-webkit-user-select:none;user-select:none}
.g{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:minmax(48px,auto);gap:5px;height:100%;overflow-y:auto}
.c{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:10px 12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow:hidden}
.c3{grid-column:span 3}.c2{grid-column:span 2}
.tt{font-size:12px;font-weight:600;color:#eee}
.ts{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tm{font-size:9px;color:rgba(255,255,255,.25);margin-top:4px}
.clk{font-size:80px;font-weight:700;text-align:center;line-height:1}
.clk span{font-size:28px;color:#60a5fa;font-weight:500}
.cld{font-size:10px;text-align:center;color:rgba(255,255,255,.3);margin-top:2px}
.wx{text-align:center;padding:6px 0}
.wt{font-size:48px;font-weight:700}
.wd{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
.wxh{font-size:9px;color:rgba(255,255,255,.2);margin-top:1px}
.lvl1{border-color:rgba(239,68,68,.08);background:rgba(239,68,68,.03)}
.lvl2{border-color:rgba(245,158,11,.06);background:rgba(245,158,11,.025)}
.lvl3{border-color:rgba(100,160,255,.05);background:rgba(100,160,255,.02)}
.lvl4{border-color:rgba(255,255,255,.04)}
.lvX{border-color:rgba(255,255,255,.05)}
.spin{display:inline-block;width:8px;height:8px;border:2px solid rgba(255,255,255,.1);border-top-color:#60a5fa;border-radius:50%;animation:s .6s linear infinite;margin-right:4px;vertical-align:middle}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div class="g" id="g"></div>
<script>
var A='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
function tick(){var n=new Date();document.getElementById('t').innerHTML=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2)+' <span>.'+('00'+n.getMilliseconds()).slice(-3)+'</span>';document.getElementById('td').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()]}

function build(){var h='';h+='<div class="c c3"><div class="clk" id="t">--:--:--</div><div class="cld" id="td">----</div><div class="cld" id="ci">广州</div></div>';
h+='<div class="c c2 lvX" id="wc"><div class="wx" id="wi"><div class="wt">--°</div><div class="wd">天气加载中<span class="spin"></span></div></div></div>';
h+='<div class="c c2 lvX"><div class="tt">📋 要闻总览</div><div class="ts" id="ot">AI 简报加载中<span class="spin"></span></div></div>';
for(var i=0;i<ns.length;i++){var n=ns[i],lv=n.level==='critical'?'1':n.level==='high'?'2':n.level==='low'?'4':'3';h+='<div class="c lvl'+lv+(i<2?' c2':'')+'"><div class="tt">'+em(n.title)+' '+n.title+'</div>'+(n.summary?'<div class="ts">'+n.summary+'</div>':'')+(n.metric?'<div class="tm">'+n.metric+'</div>':'')+'</div>'}
document.getElementById('g').innerHTML=h;tick()}
function em(t){var s=(t||'').toLowerCase();if(/战争|冲突|空袭|军事|导弹|军队/.test(t))return'⚔️';if(/经济|市场|股票|金融|利率|美元|货币/.test(t))return'💹';if(/政治|选举|总统|国会|政府|法律/.test(t))return'🏛️';if(/科技|AI|芯片|数据|网络/.test(t))return'🔬';if(/健康|医疗|疾病|药物|病毒/.test(t))return'🏥';if(/气候|环境|能源|自然|天气/.test(t))return'🌍';if(/体育|比赛|运动/.test(t))return'⚽';return'📌'}
var ns=[];
build();setInterval(tick,100);

// Weather
fetch(A+'/api/weather?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(w){
  var c=w.current;document.getElementById('wi').innerHTML='<div class="wt">'+Math.round(c.temperature_2m)+'°C</div><div class="wd">☀️ '+({0:'晴天',1:'少云',2:'多云',3:'阴天',45:'雾',51:'雨',61:'雨',71:'雪',80:'阵雨',95:'雷暴'}[c.weather_code]||'--')+'</div><div class="wxh">湿度 '+(c.relative_humidity_2m||'')+'%</div>';
  fetch(A+'/api/geocode?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(d){var a=(d&&d.address)||d||{};var cc=a.city||a.town||a.county||'';if(cc)document.getElementById('ci').textContent=cc});
});

// News
fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){
  if(!d||!d.length)return;ns=d;build();
  // Brief summary to outline card
  fetch(A+'/api/news-summary').then(function(r){return r.json()}).then(function(s){
    if(s&&s.summary){var lines=s.summary.split('\n').filter(function(l){return l.trim()&&!l.match(/^##/)});document.getElementById('ot').textContent=lines.slice(0,3).join(' · ')}
  });
});
</script></body></html>

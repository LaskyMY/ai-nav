<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0a0a0f">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金融每日简报</title>
<link rel="stylesheet" href="./shared.css">
<style>
*{-webkit-font-smoothing:antialiased}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:rgba(255,255,255,.9);font-family:system-ui,sans-serif;font-size:14px;line-height:1.8;padding:16px;max-width:750px;margin:0 auto;padding-bottom:32px;overflow-x:hidden}
h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--a1),var(--pink));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tFlow 5s ease-in-out infinite;margin-bottom:2px}
.sub{font-size:10px;color:rgba(255,255,255,.35);margin-bottom:20px}

/* AI Summary Card */
.ai-summary{background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(99,102,241,.06));border:1px solid rgba(0,229,255,.15);border-radius:16px;padding:20px 22px;margin-bottom:20px}
.ai-summary .ast{font-size:11px;color:#00e5ff;font-weight:700;margin-bottom:10px;letter-spacing:1px}
.ai-summary .asc{font-size:14px;color:rgba(255,255,255,.85);line-height:2}
.ai-summary .asc li{margin:6px 0;padding-left:4px}
.ai-summary .asc b,.ai-summary .asc strong{color:#fbbf24}

/* Day Section */
.day-section{margin-bottom:24px}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.day-date{font-size:15px;font-weight:700;color:#818cf8}
.day-badges{display:flex;gap:6px}
.badge{font-size:10px;padding:4px 10px;border-radius:6px;font-weight:600}
.badge.morning{background:rgba(245,158,11,.12);color:#fbbf24}
.badge.evening{background:rgba(99,102,241,.12);color:#818cf8}

/* Brief Content Card */
.brief.card{position:relative;overflow:hidden;backdrop-filter:saturate(180%)blur(40px);-webkit-backdrop-filter:saturate(180%)blur(40px);background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.brief-card.morning{border-left:3px solid rgba(245,158,11,.35)}
.brief-card.evening{border-left:3px solid rgba(99,102,241,.35)}
.brief-time{font-size:11px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.morning .brief-time{color:#fbbf24}.evening .brief-time{color:#818cf8}
.brief-time .dot{width:6px;height:6px;border-radius:3px;display:inline-block}
.morning .brief-time .dot{background:#fbbf24}.evening .brief-time .dot{background:#818cf8}

/* Rich Text Rendering */
.rich-text{font-size:13px;color:rgba(255,255,255,.7);line-height:2}
.rich-text h2{font-size:16px;font-weight:700;color:#fff;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06)}
.rich-text h3{font-size:14px;font-weight:700;color:rgba(255,255,255,.9);margin:12px 0 6px}
.rich-text h4{font-size:13px;font-weight:700;color:rgba(255,255,255,.75);margin:10px 0 4px}
.rich-text p{margin:6px 0}
.rich-text ul,.rich-text ol{padding-left:18px;margin:6px 0}
.rich-text li{margin:3px 0;list-style-type:disc}
.rich-text li::marker{color:rgba(255,255,255,.2)}
.rich-text hr{border:none;border-top:1px solid rgba(255,255,255,.05);margin:14px 0}
.rich-text blockquote{border-left:3px solid rgba(0,229,255,.2);padding:4px 12px;margin:8px 0;color:rgba(255,255,255,.5);font-style:italic}

/* Financial Data Highlighting */
.up,.positive{color:#10b981;font-weight:600}
.down,.negative{color:#f87171;font-weight:600}
.pct{font-weight:600}
.pct.up{color:#10b981}.pct.down{color:#f87171}
.price{font-family:'SF Mono',Monaco,monospace;color:rgba(255,255,255,.85);font-weight:600}
.stock{color:#818cf8;font-weight:600}
.num{font-family:'SF Mono',Monaco,monospace;color:rgba(255,255,255,.8)}
.keyword{background:rgba(99,102,241,.12);color:#a5b4fc;padding:1px 6px;border-radius:4px;font-size:.9em}
.metric{display:inline-block;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:3px 10px;margin:2px 4px 2px 0;font-size:.9em;font-family:'SF Mono',Monaco,monospace}
.section-icon{display:inline-block;width:20px;text-align:center;margin-right:4px}

/* Reading controls */
.read-controls{text-align:right;margin-bottom:6px}
.expand-btn{font-size:10px;color:rgba(255,255,255,.25);cursor:pointer;padding:4px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.06);background:transparent;transition:all .15s}
.expand-btn:hover{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.15)}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:rgba(255,255,255,.2);font-size:14px}
.empty .e{font-size:44px;margin-bottom:12px}

/* Source link */
.source-link{font-size:9px;color:rgba(255,255,255,.15);margin-top:12px;word-break:break-all;border-top:1px solid rgba(255,255,255,.03);padding-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px}
.tag.ai{background:rgba(16,185,129,.12);color:#10b981}

/* Responsive */
@media(max-width:500px){
  .rich-text{font-size:12px}
  .ai-summary{padding:14px 16px}
  .brief.card{position:relative;overflow:hidden;backdrop-filter:saturate(180%)blur(40px);-webkit-backdrop-filter:saturate(180%)blur(40px);padding:14px 16px}
}
.bg__orb:nth-child(3){width:350px;height:350px;background:radial-gradient(circle,var(--cyan) 0%,transparent 70%);top:50%;left:50%;animation:floatOrb 22s ease-in-out infinite;animation-delay:-7s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 45%,transparent 65%,rgba(255,255,255,.01) 100%);pointer-events:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
@keyframes floatOrb{0%,100%{transform:translate(0,0)scale(1)}25%{transform:translate(80px,-60px)scale(1.15)}50%{transform:translate(-40px,40px)scale(.9)}75%{transform:translate(-60px,-30px)scale(1.1)}}
</style>
</head>
<body>
<div class="bg"><div class="bg__orb"></div><div class="bg__orb"></div><div class="bg__orb"></div></div>
<div class="glow-spot" id="glowSpot"></div>

<h1>金融每日简报</h1>

<div style="display:flex;gap:8px;align-items:center;margin:12px 0">
  <button class="btn" onclick="prevDay()" style="flex:1">← 前一天</button>
  <span id="dateNavLabel" style="font-size:12px;color:var(--tx3);white-space:nowrap"></span>
  <button class="btn" onclick="nextDay()" style="flex:1">后一天 →</button>
</div>
<script>
var currentOffset=0;
function loadDay(offset){
  currentOffset=offset;
  var d=new Date();d.setDate(d.getDate()-offset);
  var dateStr=d.toISOString().slice(0,10);
  document.getElementById("dateNavLabel").textContent=offset===0?"今天":offset===1?"昨天":dateStr;
  var A=location.hostname==="localhost"?"http://localhost:8765":"https://99107705bcfb4f23-183-6-87-29.serveousercontent.com";
  fetch(A+"/api/financial/briefs?days="+(offset+3)).then(function(r){return r.json()}).then(function(b){
    var filtered=b.filter(function(x){return x.date===dateStr});
    if(filtered.length)render(filtered);
    else document.getElementById("briefList").innerHTML='<div class="empty"><div class="e">📭</div>'+dateStr+' 无数据</div>';
  }).catch(function(){});
}
function prevDay(){loadDay(currentOffset+1)}
function nextDay(){if(currentOffset>0)loadDay(currentOffset-1)}
document.addEventListener("DOMContentLoaded",function(){loadDay(0)});
</script>
<div class="sub" id="todayLabel" style="display:none">加载中...</div>

<!-- AI 要点摘要 -->
<div class="ai-summary" id="aiSummary" style="display:none">
  <div class="ast">🤖 AI 今日要点</div>
  <div class="asc" id="aiSummaryText"></div>
</div>

<!-- 简报列表 -->
<div id="briefList">
  <div class="empty"><div class="e">📭</div>加载中...</div>
</div>

<p style="text-align:center;margin-top:32px"><a href="./manual.html" style="color:rgba(255,255,255,.2);font-size:10px;text-decoration:none">← 返回生活手册</a></p>

<script>
var A='https://99107705bcfb4f23-183-6-87-29.serveousercontent.com';

// ── Rich Text to HTML Renderer ──
function richRender(text) {
  if (!text) return '';
  // Aggressive clean before any processing
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f]/g,'');
  text = text.replace(/[�]|\b\d{6,}\b/g,'');
  text = text.replace(/[?]{2,}/g,' ');
  var h = text;

  // Escape HTML first
  h = h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ==== HEADINGS ====
  // 【标题】style
  h = h.replace(/【([^】]+)】/g, '<h3>$1</h3>');
  // ## style
  h = h.replace(/^##\s*(.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^###\s*(.+)$/gm, '<h3>$1</h3>');
  // ⭐ emoji-prefixed headers
  h = h.replace(/^(⭐|📊|💬|🔴|🟢|🟡|📰|🔥|⚠️|✅|❌)\s*(.+)$/gm, '<h4><span class="section-icon">$1</span>$2</h4>');
  h = h.replace(/^(☀️|🌙)\s*(.+)$/gm, '<h3>$1 $2</h3>');

  // ==== SEPARATOR ====
  h = h.replace(/^---+$/gm, '<hr>');
  h = h.replace(/^\*\*\*+$/gm, '<hr>');

  // ==== NUMBERS & PRICES ====
  // Price patterns: ¥481.60, $222.82, €100
  h = h.replace(/([¥\$€])\s*(\d+[\.,]?\d*)/g, '<span class="price">$1$2</span>');
  // Pure large numbers (like stock prices without symbol)
  h = h.replace(/\b(\d{2,5}\.\d{2})\b/g, '<span class="price">$1</span>');
  // Large integers (like volumes, market caps)
  h = h.replace(/\b(\d{3,}(?:\.\d+)?[万亿]?)\b/g, function(m){
    if (m.indexOf('.')>-1 || m.length>3) return '<span class="num">'+m+'</span>';
    return m;
  });

  // ==== PERCENTAGES ====
  // +10.46% → green  /  -4.17% → red
  h = h.replace(/(\+[\d.]+%)/g, '<span class="pct up">$1</span>');
  h = h.replace(/(-[\d.]+%)/g, '<span class="pct down">$1</span>');
  // Bare percentages with sign context
  h = h.replace(/[+＋]([\d.]+%)/g, '<span class="pct up">+$1</span>');
  h = h.replace(/[-－]([\d.]+%)/g, '<span class="pct down">-$1</span>');
  // Up/down words
  h = h.replace(/(暴涨|涨|飙升|领涨|新高|反弹)/g, '<span class="up">$1</span>');
  h = h.replace(/(暴跌|跌|跳水|回调)/g, '<span class="down">$1</span>');

  // ==== STOCK TICKERS ====
  h = h.replace(/\b(腾讯|阿里|百度|京东|美团|字节|华为|小米|苹果|微软|谷歌|亚马逊|Meta|英伟达|特斯拉|宁德时代|比亚迪|中芯国际|工业富联|中际旭创|新易盛|Marvell|Coherent|HPE|ServiceNow|Anthropic|OpenAI|SpaceX)\b/g, '<span class="stock">$1</span>');

  // ==== KEY METRICS ====
  // "XX亿" patterns
  h = h.replace(/(\d+[\d.]*[万亿]?(?:美元|港元|人民币|元))/g, '<span class="metric">$1</span>');

  // ==== BOLD & EMPHASIS ====
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/__([^_]+)__/g, '<strong>$1</strong>');

  // ==== LINKS ====
  h = h.replace(/https?:\/\/[^\s<>"']+/g, function(url){
    var short = url.replace(/^https?:\/\//,'').slice(0,40);
    return '<a href="'+url+'" target="_blank" style="color:rgba(99,102,241,.5);font-size:.85em;text-decoration:underline;text-underline-offset:2px">'+short+'...</a>';
  });

  // ==== LISTS ====
  // Numbered items: "1. " "2. "
  h = h.replace(/(?:^|\n)(\d+)[\.\)]\s+(.+?)(?=\n\d+[\.\)]|\n\n|$)/gm, function(m, num, content){
    return '\n<li value="'+num+'">'+content.trim()+'</li>';
  });
  // Dash items
  h = h.replace(/(?:^|\n)[-–—•]\s+(.+?)(?=\n[-–—•]|\n\n|$)/gm, function(m, content){
    return '\n<li>'+content.trim()+'</li>';
  });

  // ==== PARAGRAPHS & LINE BREAKS ====
  // Single newline → <br> for readability
  h = h.replace(/\n/g, '<br>');
  // Double <br> → paragraph break
  h = h.replace(/(?:<br>\s*){2,}/g, '</p><p>');
  // Wrap in paragraph
  h = '<p>'+h+'</p>';
  // Clean empty paragraphs
  h = h.replace(/<p>\s*<\/p>/g, '');
  h = h.replace(/<p><br>/g, '<p>');

  // Wrap consecutive <li> in <ul>
  h = h.replace(/((?:\s*<li[^>]*>.*?<\/li>\s*)+)/g, function(m){
    return '<ul>'+m+'</ul>';
  });

  return h;
}

// ── Format date ──
function fmtDate(d) {
  var dt = new Date(d), now = new Date();
  var diff = Math.floor((now-dt)/86400000);
  if (diff===0) return '今天';
  if (diff===1) return '昨天';
  return dt.getFullYear()+'年'+(dt.getMonth()+1)+'月'+dt.getDate()+'日';
}

// ── Load Data ──
function load() {
  document.getElementById('todayLabel').textContent = '加载中...';
  fetch(A+'/api/financial/briefs?days=10').catch(function(){return fetch('http://localhost:8765/api/financial/briefs?days=10')}).catch(function(){return fetch('https://99107705bcfb4f23-183-6-87-29.serveousercontent.com/api/financial/briefs?days=10')})
    .then(function(r){return r.json()})
    .then(function(b){render(b||[])})
    .catch(function(){
      fetch('http://localhost:8765/api/financial/briefs?days=10')
        .then(function(r){return r.json()})
        .then(function(b){render(b||[])})
        .catch(function(){
          document.getElementById('briefList').innerHTML='<div class="empty"><div class="e">🔌</div>无法连接到服务器<br><span style="font-size:10px">请确认Mac上的服务器正在运行</span></div>';
        });
    });
}

function render(briefs) {
  if (!briefs.length) {
    document.getElementById('briefList').innerHTML='<div class="empty"><div class="e">📭</div>暂无简报数据<br><span style="font-size:10px">每日6:00自动从腾讯文档抓取</span></div>';
    document.getElementById('todayLabel').textContent='无数据';
    return;
  }

  // Group by date
  var byDate={};
  for (var i=0;i<briefs.length;i++){
    var b=briefs[i];
    if(!byDate[b.date])byDate[b.date]={morning:null,evening:null,summary:null};
    byDate[b.date][b.type]=b;
  }

  var dates=Object.keys(byDate).sort().reverse();
  var latest=dates[0];
  document.getElementById('todayLabel').textContent=fmtDate(latest)+' · '+dates.length+'天数据 · 每日6:00自动更新';

  // AI Summary
  var td=byDate[latest];
  if(td&&td.summary){
    document.getElementById('aiSummary').style.display='block';
    document.getElementById('aiSummaryText').innerHTML=richRender(td.summary.content.slice(0,600));
  }

  // Build day sections
  var html='';
  for(var d=0;d<dates.length;d++){
    var date=dates[d],data=byDate[date];
    var hasM=data.morning&&data.morning.content.trim();
    var hasE=data.evening&&data.evening.content.trim();
    if(!hasM&&!hasE)continue;

    html+='<div class="day-section">';
    html+='<div class="day-header"><span class="day-date">'+fmtDate(date)+'</span><div class="day-badges">';
    if(hasM)html+='<span class="badge morning">☀ 早间</span>';
    if(hasE)html+='<span class="badge evening">🌙 晚间</span>';
    if(data.summary)html+='<span class="tag ai">AI摘要</span>';
    html+='</div></div>';

    if(hasM){
      var mc = data.morning.content.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f]/g,'').replace(/[�]|\b\d{6,}\b/g,'').replace(/[?]{2,}/g,' ');
      var mt=richRender(mc);
      html+='<div class="brief-card morning">';
      html+='<div class="brief-time"><span class="dot"></span>早间简报</div>';
      html+='<div class="rich-text">'+mt+'</div>';
      html+='</div>';
    }
    if(hasE){
      var ec = data.evening.content.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f]/g,'').replace(/[�]|\b\d{6,}\b/g,'').replace(/[?]{2,}/g,' ');
      var et=richRender(ec);
      html+='<div class="brief-card evening">';
      html+='<div class="brief-time"><span class="dot"></span>晚间简报</div>';
      html+='<div class="rich-text">'+et+'</div>';
      html+='</div>';
    }
    html+='</div>';
  }
  document.getElementById('briefList').innerHTML=html;
}

load();
</script>
<script src="./shared.js"></script>
</body>
</html>

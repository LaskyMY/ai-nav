<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0a0a0f">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DeepSeek 用量</title>
<link rel="stylesheet" href="./shared.css">
<style>
*{-webkit-font-smoothing:antialiased}
:root{--bg:#050510;--card-bg:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.07);--cyan:#00e5ff;--tx:rgba(255,255,255,.92);--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.28);--purple:#a855f7;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;line-height:1.5;padding:16px;max-width:520px;margin:0 auto;}
h1{font-size:20px;font-weight:700;margin-bottom:4px;color:var(--cyan);;background:linear-gradient(135deg,var(--a1),var(--cyan),var(--pink));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:tFlow 5s ease-in-out infinite}
.sub{font-size:10px;color:var(--tx3);margin-bottom:20px;}
.card{position:relative;overflow:hidden;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;margin-bottom:10px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0;}
.lbl{color:var(--tx2);}
.val{font-weight:600;}
.big{font-size:24px;color:var(--cyan);}
.cost{color:#f59e0b;}
.table-wrap{width:100%;border-collapse:collapse;margin-top:8px;font-size:10px;}
td,th{border-bottom:1px solid rgba(255,255,255,.06);padding:4px 2px;text-align:right;}
th{color:var(--tx3);font-weight:500;}
td:first-child,th:first-child{text-align:left;}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:4px;overflow:hidden;}
.bar-fill{height:100%;background:var(--cyan);border-radius:2px;}
.spin{display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--cyan);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tFlow{0%{background-position:0 50%}50%{background-position:100% 100%}100%{background-position:0 50%}}
.bg__orb:nth-child(3){width:350px;height:350px;background:radial-gradient(circle,var(--cyan) 0%,transparent 70%);top:50%;left:50%;animation:floatOrb 22s ease-in-out infinite;animation-delay:-7s}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 45%,transparent 65%,rgba(255,255,255,.01) 100%);pointer-events:none}
@keyframes floatOrb{0%,100%{transform:translate(0,0)scale(1)}25%{transform:translate(80px,-60px)scale(1.15)}50%{transform:translate(-40px,40px)scale(.9)}75%{transform:translate(-60px,-30px)scale(1.1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
</style>
</head>
<body>
<div class="bg"><div class="bg__orb"></div><div class="bg__orb"></div><div class="bg__orb"></div></div>
<div class="glow-spot" id="glowSpot"></div>
<h1>DeepSeek API 用量</h1>
<div class="sub" id="updated">加载中<span class="spin"></span></div>

<div class="card"><div class="row"><span class="lbl">总 Token</span><span class="val big" id="totalTokens">--</span></div><div class="row"><span class="lbl">总花费 (估算)</span><span class="val cost" id="totalCost">--</span></div></div>

<div class="card"><div class="row"><span class="lbl">调用次数</span><span class="val" id="totalCalls">--</span></div><div class="row"><span class="lbl">Prompt Tokens</span><span class="val" id="promptTokens">--</span></div><div class="row"><span class="lbl">Completion Tokens</span><span class="val" id="completionTokens">--</span></div></div>

<div class="card" style="border-color:rgba(168,85,247,.15);"><div style="font-size:11px;color:var(--purple);margin-bottom:4px;font-weight:600;">对话用量 (估算)</div><div class="row"><span class="lbl">对话 Token</span><span class="val" id="convTokens">--</span></div><div class="row"><span class="lbl">对话花费 (估算)</span><span class="val cost" id="convCost">--</span></div><div class="row"><span class="lbl">总计 (网站+对话)</span><span class="val big" id="grandTotal">--</span></div></div>

<div class="card"><div style="font-size:11px;color:var(--tx3);margin-bottom:6px;">每日用量</div><div id="dailyList">--</div></div>

<script>var API='https://99107705bcfb4f23-183-6-87-29.serveousercontent.com';function load(){fetch(API+'/api/usage').then(function(r){return r.json()}).then(function(d){document.getElementById('updated').textContent='更新: '+new Date().toLocaleTimeString('zh-CN');document.getElementById('totalTokens').textContent=d.total.tokens.toLocaleString();document.getElementById('totalCost').textContent='\u0024'+d.total.cost.toFixed(5)+' (\u00a5'+(d.total.cost*7.2).toFixed(3)+')';document.getElementById('promptTokens').textContent=d.total.prompt.toLocaleString();document.getElementById('completionTokens').textContent=d.total.completion.toLocaleString();if(d.conversation){document.getElementById('convTokens').textContent=d.conversation.tokens.toLocaleString();document.getElementById('convCost').textContent='\u0024'+d.conversation.cost.toFixed(5)+' (\u00a5'+(d.conversation.cost*7.2).toFixed(3)+')';document.getElementById('grandTotal').textContent='\u0024'+(d.total.cost+d.conversation.cost).toFixed(4)+' (\u00a5'+((d.total.cost+d.conversation.cost)*7.2).toFixed(2)+')'}var calls=0;for(var i=0;i<d.entries.length;i++)calls+=1;document.getElementById('totalCalls').textContent=calls+' \u6b21';var maxT=1;for(var i=0;i<d.days.length;i++)if(d.days[i].tokens>maxT)maxT=d.days[i].tokens;var html='';for(var i=0;i<Math.min(d.days.length,14);i++){var day=d.days[i];var pct=(day.tokens/maxT*100).toFixed(0);html+='<div class="row"><span>'+day.day+'</span><span>'+day.tokens.toLocaleString()+' tokens</span></div><div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>'}document.getElementById('dailyList').innerHTML=html||'暂无数据'}).catch(function(){document.getElementById('updated').innerHTML='<span style="color:#ef4444">加载失败</span>'})}load();setInterval(load,60000)</script>
<script src="./floating-nav.js"></script>
<script src="./shared.js"></script>
<p style="text-align:center;margin-top:24px"><a href="./index.html" style="color:rgba(255,255,255,.2);font-size:10px;text-decoration:none">← 返回主页</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="description" content="AI Nav 数据看板 — 实时热点聚合">
<meta name="theme-color" content="#0a0a0f">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>数据看板 · AI Nav</title>
<link rel="preconnect" href="https://api.github.com">
<link rel="dns-prefetch" href="https://hacker-news.firebaseio.com">
<link rel="stylesheet" href="./shared.css">
<link rel="icon" href="./icon.svg">
<style>
:root{--bg:#0a0a0f;--a1:#6366f1;--cyan:#06B6D4;--pink:#ec4899;--amber:#F59E0B;--green:#10B981;--red:#EF4444;--tx:rgba(255,255,255,.92);--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.35);--tx4:rgba(255,255,255,.18);--r:14px;--ease:cubic-bezier(.22,1,.36,1)}
*,::before,::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6;min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg__orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.35}
.bg__orb:nth-child(1){width:500px;height:500px;background:radial-gradient(circle,var(--cyan) 0%,transparent 70%);top:-15%;left:-10%;animation:floatOrb 20s ease-in-out infinite}
.bg__orb:nth-child(2){width:400px;height:400px;background:radial-gradient(circle,var(--pink) 0%,transparent 70%);bottom:-10%;right:-8%;animation:floatOrb 24s ease-in-out infinite reverse}
.bg__orb:nth-child(3){width:350px;height:350px;background:radial-gradient(circle,var(--a1) 0%,transparent 70%);top:50%;left:50%;animation:floatOrb 22s ease-in-out infinite;animation-delay:-7s}
@keyframes floatOrb{0%,100%{transform:translate(0,0)scale(1)}25%{transform:translate(80px,-60px)scale(1.15)}50%{transform:translate(-40px,40px)scale(.9)}75%{transform:translate(-60px,-30px)scale(1.1)}}
.glow-spot{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:1}
.wrap{max-width:960px;margin:0 auto;padding:20px;position:relative;z-index:1}
h1{font-size:22px;font-weight:700;margin:8px 0 4px;background:linear-gradient(135deg,var(--cyan),var(--a1),var(--pink));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:tFlow 5s ease-in-out infinite}
@keyframes tFlow{0%{background-position:0 50%}50%{background-position:100% 100%}100%{background-position:0 50%}}
.sub{font-size:11px;color:var(--tx3);margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:16px 0}
.feed-card{background:rgba(255,255,255,.04);backdrop-filter:saturate(180%) blur(40px);-webkit-backdrop-filter:saturate(180%) blur(40px);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);overflow:hidden;position:relative;animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.feed-card::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 45%,transparent 65%,rgba(255,255,255,.01) 100%);pointer-events:none}
.stats-bar .stat-chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 14px;text-align:center;flex:1;min-width:60px}.stat-chip b{display:block;font-size:18px;color:var(--cyan);font-weight:700}.stat-chip span{font-size:9px;color:var(--tx3)}.chart-box{width:100%;height:120px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,.2);margin-bottom:14px}.chart-box canvas{width:100%;height:100%}.feed-card:nth-child(2){animation-delay:.03s}.feed-card:nth-child(3){animation-delay:.06s}.feed-card:nth-child(4){animation-delay:.09s}.feed-card:nth-child(5){animation-delay:.12s}.feed-card:nth-child(6){animation-delay:.15s}
.feed-hd{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:8px}
.feed-hd .icon{font-size:16px}.feed-hd .title{font-size:13px;font-weight:700}.feed-hd .count{font-size:10px;color:var(--tx3);margin-left:auto;background:rgba(255,255,255,.04);padding:2px 8px;border-radius:8px}
.feed-body{padding:8px 0;max-height:400px;overflow-y:auto}
.feed-item{display:block;padding:8px 16px;text-decoration:none;color:var(--tx);transition:all .2s;border-bottom:1px solid rgba(255,255,255,.02)}
.feed-item:hover{background:rgba(255,255,255,.03)}
.feed-item .item-title{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:2px}
.feed-item .item-meta{font-size:10px;color:var(--tx3);display:flex;gap:10px}
.feed-item .item-desc{font-size:11px;color:var(--tx3);margin-top:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge-stars{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;background:rgba(245,158,11,.12);color:var(--amber)}
.badge-lang{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;background:rgba(99,102,241,.12);color:var(--a1)}
.badge-score{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;background:rgba(16,185,129,.12);color:var(--green)}
.feed-loading{text-align:center;padding:20px;color:var(--tx4);font-size:11px}
.feed-error{text-align:center;padding:16px;color:var(--red);font-size:11px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
@media(prefers-color-scheme:light){body{--bg:#f5f5f7;--tx:#1a1a1a;--tx2:#666;--tx3:#999;--tx4:#ccc}}
.reading-progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--a1),var(--pink));z-index:200;transition:width .1s linear}
@media(min-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}.wrap{max-width:1200px}}@media(orientation:landscape)and(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.06) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="bg"><div class="bg__orb"></div><div class="bg__orb"></div><div class="bg__orb"></div></div>
<div class="glow-spot" id="glowSpot"></div>
<div class="wrap">
<h1>📊 数据看板</h1>
<p class="sub">实时数据聚合 · 每5分钟自动刷新 · <span id="lastUpdate">加载中...</span></p>

<div class="font-ctrl" style="display:flex;gap:4px;margin-bottom:8px"><button onclick="setFont(13)" style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--tx3);cursor:pointer">小</button><button onclick="setFont(14)" style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--tx3);cursor:pointer">中</button><button onclick="setFont(16)" style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--tx3);cursor:pointer">大</button></div><div class="tag-cloud" id="tagCloud" style="margin:8px 0 14px;line-height:1.8"></div><div class="stats-bar" id="statsBar" style="display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap">
  <div class="stat-chip"><b id="statTotal">0</b><span>数据源</span></div>
  <div class="stat-chip"><b id="statLive">0</b><span>在线</span></div>
  <div class="stat-chip"><b id="statItems">0</b><span>条目</span></div>
  <div class="stat-chip"><b id="statUpdated">--</b><span>更新</span></div>
</div>
<div class="chart-box"><canvas id="trendChart"></canvas></div><div class="grid" id="dashboard"></div>
</div>
<script>
var A=location.hostname==='localhost'?'http://localhost:8765':'https://99107705bcfb4f23-183-6-87-29.serveousercontent.com';
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fm(n){return n>999?(n/1000).toFixed(1)+'k':String(n)}
var feeds=[
  {id:'github',icon:'🐙',title:'GitHub 热门',url:'/api/trending/github',render:function(i){return '<a class="feed-item" href="'+(i.url||'#')+'" target="_blank"><div class="item-title">'+esc(i.name)+'</div><div class="item-meta"><span class="badge-stars">⭐'+fm(i.stars)+'</span>'+(i.lang?'<span class="badge-lang">'+esc(i.lang)+'</span>':'')+'</div>'+(i.desc?'<div class="item-desc">'+esc(i.desc)+'</div>':'')+'</a>'}},
  {id:'gap',icon:'📈',title:'信息差',url:'/api/insight/gap',render:function(i){return '<div class="feed-item"><div class="item-title" style="color:var(--cyan)">'+esc(i.source)+' 独有热点</div><div class="item-desc">'+(i.unique||[]).slice(0,3).map(function(t){return esc(t)}).join(' · ')+'</div></div>'},extract:'gaps'},
  {id:'ph',icon:'🛒',title:'ProductHunt',url:'/api/trending/ph',render:function(i){return '<a class="feed-item" href="'+i.url+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span>▲'+i.votes+'</span><span>'+esc(i.source)+'</span></div><div class="item-desc">'+esc(i.tagline||'')+'</div></a>'}},
  {id:'hf',icon:'🤖',title:'HF模型趋势',url:'/api/trending/hf',render:function(i){return '<a class="feed-item" href="'+i.url+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span class="badge-stars">⬇'+fm(i.downloads)+'</span><span>❤'+i.likes+'</span></div></a>'}},
  {id:'juejin',icon:'📱',title:'掘金热门',url:'/api/trending/juejin',render:function(i){return '<a class="feed-item" href="'+i.url+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span>'+esc(i.source)+'</span></div></a>'}},
  {id:'reddit',icon:'💻',title:'Reddit 编程',url:'/api/trending/reddit',render:function(i){return '<a class="feed-item" href="'+i.url+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span class="badge-score">▲'+i.score+'</span><span>💬 '+i.comments+'</span></div></a>'}},
  {id:'v2ex2',icon:'💬',title:'V2EX 最新',url:'/api/trending/v2ex2',render:function(i){return '<a class="feed-item" href="'+i.url+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span>💬 '+i.replies+'</span><span>'+esc(i.node)+'</span></div></a>'}},
  {id:'zhihu',icon:'📰',title:'知乎日报',url:'/api/trending/zhihu',render:function(i){return '<a class="feed-item" href="'+i.url+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span>'+esc(i.source)+'</span></div></a>'}},
  {id:'startups',icon:'🚀',title:'创业热点',url:'/api/trending/startups',render:function(i){return '<a class="feed-item" href="'+(i.url||'#')+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span class="badge-score">▲'+i.score+'</span><span>'+esc(i.source)+'</span></div></a>'}},
  {id:'hn',icon:'🧠',title:'Hacker News',url:'/api/trending/hn',render:function(i){return '<a class="feed-item" href="'+(i.url||'#')+'" target="_blank"><div class="item-title">'+esc(i.title)+'</div><div class="item-meta"><span class="badge-score">▲'+i.score+'</span><span>by '+esc(i.by)+'</span></div></a>'}},
  {id:'news',icon:'📰',title:'AI 新闻摘要',url:'/api/news-summary',render:function(i){return '<div class="feed-item"><div class="item-title">AI 新闻简报</div><div class="item-desc">'+esc((i.summary||i.content||'').slice(0,200))+'</div></div>'},single:true},
  {id:'arxiv',icon:'🔬',title:'前沿论文',url:'/api/papers?q=AI',render:function(i){return '<a class="feed-item" href="'+(i.u||'#')+'" target="_blank"><div class="item-title">'+esc((i.t||'').slice(0,60))+'</div><div class="item-meta"><span>'+esc(i.s||'')+'</span><span>'+esc(i.d||'')+'</span></div></a>'}},
  {id:'financial',icon:'💰',title:'金融速报',url:'/api/financial/latest',render:function(i){return '<div class="feed-item"><div class="item-title">'+esc(i.title||i.type||'简报')+'</div><div class="item-desc">'+esc((i.content||'').slice(0,150))+'</div></div>'}},
  {id:'bilibili',icon:'🎬',title:'B站最新视频',url:'/bilibili/manifest.json',render:function(i){return '<a class="feed-item" href="./bilibili/'+i.bvid+'.html"><div class="item-title">'+esc((i.title||'').slice(0,50))+'</div><div class="item-meta"><span>👤 '+esc(i.upper_name)+'</span><span>▶ '+fm(i.play_count)+'</span></div></a>'},extract:'videos'},
];

async function load(f){
  var el=document.getElementById('feed-'+f.id);if(!el)return;
  el.querySelector('.feed-body').innerHTML='<div class="feed-loading">⏳</div>';
  try{
    var r=await fetch(A+f.url,{signal:AbortSignal.timeout(8000)});
    var d=await r.json();
    var items=d.items||d;
    if(f.single)items=[{summary:d.summary||d.content||''}];if(f.extract==='gaps')items=d.gaps||[];if(f.extract==='videos')items=Object.values(d.videos||{}).sort(function(a,b){return (b.fav_time||0)-(a.fav_time||0)});
    if(!items||!items.length){el.querySelector('.feed-body').innerHTML='<div class="feed-error">暂无数据</div>';return}
    el.querySelector('.feed-body').innerHTML=items.slice(0,10).map(f.render).join('');
    el.querySelector('.count').textContent=items.length;
  }catch(e){el.querySelector('.feed-body').innerHTML='<div class="feed-error">⚠️离线</div>'}
}

function build(){
  document.getElementById('dashboard').innerHTML=feeds.map(function(f){
    return '<div class="feed-card" id="feed-'+f.id+'"><div class="feed-hd"><span class="icon">'+f.icon+'</span><span class="title">'+f.title+'</span><span class="count">0</span></div><div class="feed-body"><div class="feed-loading">⏳</div></div></div>';
  }).join('');
  // feeds load via IntersectionObserver below
  updateStats();
  // Lazy load feeds with IntersectionObserver
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var feedId = e.target.id.replace('feed-','');
        var feed = feeds.find(function(f){return f.id===feedId});
        if(feed) load(feed);
        observer.unobserve(e.target);
      }
    });
  },{rootMargin:'100px'});

  // Observe each card after build
  setTimeout(function(){
    document.querySelectorAll('.feed-card').forEach(function(c){observer.observe(c)});
  },100);

  document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('zh-CN');
}

function updateStats(){
  var cards=document.querySelectorAll('.feed-card');
  var live=0,items=0;
  cards.forEach(function(c){
    var count=c.querySelector('.count');
    if(count&&parseInt(count.textContent)>0)live++;
    items+=parseInt(count.textContent)||0;
  });
  document.getElementById('statTotal').textContent=cards.length;
  document.getElementById('statLive').textContent=live;
  document.getElementById('statItems').textContent=items;
  document.getElementById('statUpdated').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}

// Trend sparkline
(function(){
  var c=document.getElementById('trendChart'),ctx=c.getContext('2d');
  var history=[];
  function draw(){
    var W=c.parentElement.clientWidth,H=c.parentElement.clientHeight;
    c.width=W;c.height=H;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,W,H);
    var now=Date.now();
    history.push({t:now,v:document.querySelectorAll('.feed-card').length});
    if(history.length>60)history.shift();
    if(history.length<2)return;
    ctx.beginPath();ctx.strokeStyle='rgba(6,182,212,.6)';ctx.lineWidth=2;
    var maxV=Math.max.apply(null,history.map(function(h){return h.v}));
    var minV=Math.min.apply(null,history.map(function(h){return h.v}));
    var range=maxV-minV||1;
    var xStep=W/(history.length-1);
    history.forEach(function(h,i){
      var x=i*xStep,y=H-((h.v-minV)/range)*H*0.8-10;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // Fill
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    ctx.fillStyle='rgba(6,182,212,.05)';ctx.fill();
    requestAnimationFrame(draw);
  }
  draw();setInterval(function(){draw()},30000);
})();

function setFont(s){document.body.style.fontSize=s+'px';localStorage.setItem('fontSize',s);}var fs=localStorage.getItem('fontSize');if(fs)document.body.style.fontSize=fs+'px';
window.addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-window.innerHeight;var p=h>0?(window.scrollY/h)*100:0;var el=document.getElementById('readProgress');if(!el){el=document.createElement('div');el.id='readProgress';el.className='reading-progress';document.body.appendChild(el);}el.style.width=p+'%';});
document.addEventListener('keydown',function(e){if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});}if(e.key==='r'&&e.ctrlKey){location.reload();}});
build();setTimeout(function(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var fid=e.target.id.replace('feed-','');var f=feeds.find(function(x){return x.id===fid});if(f)load(f);io.unobserve(e.target)}})});
  document.querySelectorAll('.feed-card').forEach(function(c){io.observe(c)});
},200);
setInterval(build,300000);

</script>
<script>(function(){var g=document.getElementById('glowSpot');if(!g||('ontouchstart' in window))return;var x=innerWidth/2,y=innerHeight/2,tx=x,ty=y;document.addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY});function anim(){x+=(tx-x)*0.05;y+=(ty-y)*0.05;g.style.background='radial-gradient(circle 420px at '+x.toFixed(0)+'px '+y.toFixed(0)+'px,rgba(99,102,241,.06) 0%,rgba(236,72,153,.035) 18%,rgba(6,182,212,.02) 42%,transparent 70%)';requestAnimationFrame(anim)}anim()})();</script>
<script src="./shared.js"></script>
<button onclick="navigator.share&&navigator.share({title:document.title,url:location.href})" style="position:fixed;bottom:80px;right:16px;z-index:90;width:38px;height:38px;border-radius:19px;background:rgba(24,24,32,.85);border:1px solid rgba(255,255,255,.1);color:var(--tx2);cursor:pointer;font-size:14px;display:none" id="shareBtn">📤</button><script>if(navigator.share)document.getElementById("shareBtn").style.display="flex"</script>
</body>
</html>

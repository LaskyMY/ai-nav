<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WebView Test</title>
<style>
body{background:#050510;color:#fff;font-family:sans-serif;padding:16px;margin:0;font-size:13px;line-height:1.8;}
h2{color:#00e5ff;font-size:15px;margin:10px 0 6px;}
.pass{color:#10b981}.fail{color:#ef4444}
.btn{display:block;width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.06);color:#fff;font-size:13px;cursor:pointer;text-align:left;}
.btn b{color:#00e5ff;}
#result{margin-top:8px;padding:8px;border-radius:8px;background:rgba(255,255,255,.03);font-size:11px;word-break:break-all;}
</style>
</head>
<body>
<h2>AI Nav 测试面板</h2>
<p>逐个点击，哪个能显示完整时钟界面？</p>

<button class="btn" onclick="test('1')"><b>1.</b> 本地 JS 基础测试</button>
<button class="btn" onclick="test('2')"><b>2.</b> ⭐ 老版时钟 clock-old.html (推荐)</button>
<button class="btn" onclick="test('3')"><b>3.</b> 新版时钟 clock.html</button>
<button class="btn" onclick="test('4')"><b>4.</b> Serveo 直连</button>
<button class="btn" onclick="test('5')"><b>5.</b> 百度 (测网络)</button>

<div id="result"></div>

<script>
var urls={
'1':'about:blank',
'2':'https://laskymy.github.io/ai-nav/clock-old.html',
'3':'https://laskymy.github.io/ai-nav/clock.html',
'4':'https://c46872d35aeba559-183-6-87-29.serveousercontent.com/clock.html',
'5':'https://www.baidu.com'
};

function test(id){
var r=document.getElementById('result');
if(id==='1'){
r.innerHTML='✅ JS OK<br>✅ DOM OK<br>✅ localStorage: '+(function(){try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return"OK";}catch(e){return"FAIL: "+e.message;}})()+'<br>✅ UA: '+navigator.userAgent.substring(0,80)+'<br>✅ 屏幕: '+screen.width+'×'+screen.height;
return;
}
r.innerHTML='⏳ 跳转中...';
window.location.href = urls[id];
}
</script>
</body>
</html>

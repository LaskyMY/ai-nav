<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Nav 时钟</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
font-family:-apple-system,sans-serif;background:#050510;color:rgba(255,255,255,.9);
font-size:13px;line-height:1.4;display:flex;flex-direction:column;
padding:calc(8px + var(--sat)) 10px calc(8px + var(--sab)) 10px;
-webkit-user-select:none;user-select:none;
}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse at 50% 20%,rgba(0,210,255,.04) 0%,transparent 60%);}

/* Card */
.card{flex-shrink:0;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);
border-radius:14px;padding:10px 14px;position:relative;z-index:1;overflow:hidden;margin-top:4px;
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.card::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;
background:linear-gradient(135deg,rgba(255,255,255,.02) 0%,transparent 50%);pointer-events:none;}
.card-inner{position:relative;z-index:1;transition:opacity .4s ease,transform .4s ease;}

/* Dot indicators */
.dots{display:flex;justify-content:center;margin-top:4px;position:absolute;bottom:4px;left:50%;transform:translateX(-50%);z-index:2;}
.dot{width:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:0 3px;transition:all .3s ease;}
.dot.on{width:14px;background:rgba(0,210,255,.6);box-shadow:0 0 4px rgba(0,210,255,.2);}

/* C1: Clock - static, no flip */
.c1-row{display:flex;align-items:center;}
.c1-t{font-size:46px;font-weight:700;color:#fff;text-shadow:0 0 20px rgba(0,210,255,.2);line-height:1;}
.c1-ms{font-size:18px;color:#00d2ff;opacity:.8;min-width:48px;display:inline-block;text-align:left;}
.c1-r{flex:1;text-align:right;margin-left:10px;}
.c1-d{font-size:13px;color:rgba(255,255,255,.5);font-weight:500;}
.c1-lu{font-size:11px;color:rgba(255,255,255,.28);margin-top:1px;}
.c1-ci{font-size:10px;color:rgba(0,210,255,.35);margin-top:1px;}

/* C2: Weather flip */
.c2-p{text-align:center;padding:4px 0;}
.c2-t{font-size:28px;font-weight:600;color:#fff;}
.c2-desc{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}
.c2-meta{font-size:10px;color:rgba(255,255,255,.25);margin-top:1px;}
.c2-label{font-size:9px;color:rgba(0,210,255,.4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}

/* C3: News flip */
.c3-p{padding:2px 0;}
.c3-s{font-size:9px;color:#00d2ff;font-weight:700;letter-spacing:.06em;}
.c3-t{font-size:12px;color:rgba(255,255,255,.6);line-height:1.4;margin-top:4px;}
.c3-n{font-size:9px;color:rgba(255,255,255,.2);margin-top:4px;}

/* C4: AI Brief flip */
.c4{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:100px;}
.c4 h2{font-size:14px;font-weight:700;color:#fff;margin:8px 0 4px;}
.c4 h3{font-size:12px;font-weight:600;color:rgba(255,255,255,.75);margin:6px 0 3px;}
.c4 p{font-size:11px;color:rgba(255,255,255,.5);margin:3px 0;line-height:1.5;}
.c4 strong{color:#f59e0b;}
.c4 table{width:100%;border-collapse:collapse;margin:4px 0;font-size:10px;}
.c4 td,.c4 th{border:1px solid rgba(255,255,255,.08);padding:3px 5px;text-align:left;}
.c4 th{background:rgba(0,210,255,.06);color:#00d2ff;font-size:10px;}
.c4 .kc{background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.1);border-radius:8px;padding:8px 10px;margin:5px 0;}
.c4 .kc p{color:rgba(255,255,255,.6);}
.c4-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:100%;}

.sp{display:inline-block;width:8px;height:8px;border:2px solid rgba(255,255,255,.1);border-top-color:#00d2ff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:3px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>

<!-- C1: Clock -->
<div class="card">
  <div class="c1-row">
    <div><span class="c1-t" id="t">--:--:--</span><span class="c1-ms" id="ms">.--</span></div>
    <div class="c1-r"><div class="c1-d" id="d">加载中</div><div class="c1-lu" id="lu">--</div><div class="c1-ci" id="ci">广州</div></div>
  </div>
</div>

<!-- C2: Weather (4 pages: now, +1h, +3h, +6h) -->
<div class="card" style="min-height:90px;">
  <div class="card-inner" id="wx-inner"></div>
  <div class="dots" id="wx-dots"></div>
</div>

<!-- C3: News (per-article flip) -->
<div class="card" style="min-height:60px;">
  <div class="card-inner" id="ns-inner"></div>
  <div class="dots" id="ns-dots"></div>
</div>

<!-- C4: AI Brief (per-section flip) -->
<div class="card c4" style="min-height:160px;">
  <div class="card-inner" id="bf-inner"></div>
  <div class="dots" id="bf-dots"></div>
</div>

<script>
var API='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var WX={0:'晴',1:'多云',2:'阴',3:'阴',45:'雾',48:'雾',51:'雨',53:'雨',55:'雨',61:'雨',63:'雨',65:'雨',71:'雪',73:'雪',75:'雪',77:'雪',80:'雨',81:'雨',82:'雨',85:'雪',86:'雪',95:'雷',96:'雷',97:'雷'};
var WXN={0:'晴天',1:'少云',2:'多云',3:'阴天',45:'雾',48:'霜雾',51:'小雨',53:'小雨',55:'中雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',77:'雪',80:'阵雨',81:'阵雨',82:'暴雨',85:'阵雪',86:'阵雪',95:'雷暴',96:'雷暴',97:'强雷暴'};

function S(k,v){try{localStorage.setItem('ck_'+k,JSON.stringify(v));}catch(e){}}
function L(k){try{return JSON.parse(localStorage.getItem('ck_'+k));}catch(e){return null;}}

// ===== Flip engine =====
var flips={};
function initFlip(id,pages,ms){
  flips[id]={data:pages,idx:0,total:pages.length,delay:ms,timer:null};
  renderDots(id);showPage(id,0,false);
  if(pages.length>1)scheduleFlip(id);
}
function showPage(id,i,anim){
  var f=flips[id];if(!f)return;
  var el=document.getElementById(id+'-inner');if(!el)return;
  if(anim){el.style.opacity='0';el.style.transform='translateY(4px)';}
  setTimeout(function(){
    el.innerHTML=f.data[i];
    if(anim){el.style.opacity='1';el.style.transform='translateY(0)';}
  },anim?200:0);
  f.idx=i;renderDots(id);
}
function nextPage(id){
  var f=flips[id];if(!f||f.total<=1)return;
  showPage(id,(f.idx+1)%f.total,true);scheduleFlip(id);
}
function scheduleFlip(id){
  var f=flips[id];if(!f||f.total<=1)return;
  if(f.timer)clearTimeout(f.timer);
  f.timer=setTimeout(function(){nextPage(id);},f.delay);
}
function renderDots(id){
  var f=flips[id],c=document.getElementById(id+'-dots');if(!c)return;
  var h='';for(var i=0;i<f.total;i++)h+='<span class="dot'+(i===f.idx?' on':'')+'"></span>';
  c.innerHTML=h;
}

// ===== C1: Clock =====
function tick(){
  var n=new Date();
  document.getElementById('t').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2);
  document.getElementById('ms').textContent='.'+('00'+n.getMilliseconds()).slice(-3);
  document.getElementById('d').textContent=(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()];
  document.getElementById('lu').textContent='农历 '+lunarStr(n);
}
setInterval(tick,80);tick();

// Lunar (abbreviated)
var LM=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var LD=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
var LI=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x16a95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0,0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,0x0d520];
function lunarDay(y,m,d){
  var i,leap=0,temp=0,offset=(Date.UTC(y,m,d)-Date.UTC(1900,0,31))/86400000;
  for(i=1900;i<2100&&offset>0;i++){temp=lunarYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var year=i,month=1,isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i==(leap+1)&&!isLeap){i--;isLeap=true;temp=leapMonthDays(year);}
    else{temp=monthDays(year,i,isLeap);isLeap=false;}
    if(isLeap&&i==(leap+1))isLeap=false;offset-=temp;
  }
  if(offset===0&&leap===i&&!isLeap)isLeap=true;
  if(offset<0)offset+=temp;month=i;
  return{year:year,month:month,day:offset+1,isLeap:isLeap};
}
function lunarYearDays(y){var i,s=348;for(i=0x8000;i>0x8;i>>=1){s+=(LI[y-1900]&i)?1:0;}return s+leapDays(y);}
function leapMonth(y){return LI[y-1900]&0xf;}
function leapDays(y){return leapMonth(y)?((LI[y-1900]&0x10000)?30:29):0;}
function leapMonthDays(y){return(LI[y-1900]&0x10000)?30:29;}
function monthDays(y,m,l){return l?leapMonthDays(y):((LI[y-1900]&(0x10000>>m))?30:29);}
function lunarStr(d){var l=lunarDay(d.getFullYear(),d.getMonth(),d.getDate());return(l.isLeap?'闰':'')+LM[l.month-1]+'月'+LD[l.day];}

// ===== C2: Weather =====
function wxFetch(){
  fetch(API+'/api/weather?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(w){
    if(!w||!w.current)return;S('wx',{d:w,ts:Date.now()});wxBuild(w);
  }).catch(function(){var c=L('wx');if(c&&Date.now()-c.ts<600000)wxBuild(c.d);});
}
function wxBuild(w){
  var c=w.current,p=[],hh=w.hourly;
  // Page 0: Now
  p.push('<div class="c2-p"><div class="c2-t">'+Math.round(c.temperature_2m)+'°C</div><div class="c2-desc">'+WXN[c.weather_code]+'</div><div class="c2-meta">湿度 '+(c.relative_humidity_2m||'--')+'%</div></div>');
  // Pages 1-3: Hourly
  if(hh&&hh.time){
    var cur=new Date().getHours(),off=[1,3,6],lab=['+1 小时','+3 小时','+6 小时'];
    for(var i=0;i<off.length;i++){
      var idx=cur+off[i];if(idx>=hh.time.length)idx=hh.time.length-1;
      var code=hh.weather_code[idx],tmp=Math.round(hh.temperature_2m[idx]);
      var rain=hh.precipitation_probability?hh.precipitation_probability[idx]:0;
      p.push('<div class="c2-p"><div class="c2-label">'+lab[i]+'</div><div class="c2-t">'+tmp+'°C</div><div class="c2-desc">'+WXN[code]+'</div>'+(rain>0?'<div class="c2-meta">降水 '+rain+'%</div>':'')+'</div>');
    }
  }
  initFlip('wx',p,5000);
  // Geo
  fetch(API+'/api/geocode?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(d){
    var a=(d&&d.address)||d||{};var city=a.city||a.town||a.county||'';
    if(city){document.getElementById('ci').textContent=city;S('city',city);}
  }).catch(function(){});
}

// ===== C3: News =====
function nsFetch(){
  fetch(API+'/api/news').then(function(r){return r.json()}).then(function(d){
    if(!d||!d.length)return;S('news',{d:d,ts:Date.now()});nsBuild(d);
  }).catch(function(){var c=L('news');if(c&&c.d&&c.d.length)nsBuild(c.d);});
}
function nsBuild(data){
  var p=[];
  for(var i=0;i<data.length;i++)p.push('<div class="c3-p"><div class="c3-s">'+data[i].source+'</div><div class="c3-t">'+data[i].title+'</div><div class="c3-n">'+(i+1)+'/'+data.length+'</div></div>');
  initFlip('ns',p,18000);
}

// ===== C4: Brief =====
function bfFetch(){
  fetch(API+'/api/news-summary').then(function(r){return r.json()}).then(function(d){
    if(!d||!d.summary)return;S('brief',{s:d.summary,ts:Date.now()});bfBuild(d.summary);
  }).catch(function(){var c=L('brief');if(c&&c.s)bfBuild(c.s);});
}
function bfBuild(md){
  var parts=md.split(/(?=^## )/m),p=[];
  for(var i=0;i<parts.length;i++){
    var s=parts[i].trim();if(!s)continue;
    p.push('<div class="c4-scroll">'+renderMd(s)+'</div>');
  }
  if(!p.length)p.push('<div>'+renderMd(md)+'</div>');
  initFlip('bf',p,10000);
}
function renderMd(md){
  var lines=md.split('\n'),html='',it=false;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(/^##\s/.test(l)){if(it){html+='</table>';it=false;}html+='<h2>'+l.replace(/^##\s*/,'')+'</h2>';continue;}
    if(/^###\s/.test(l)){if(it){html+='</table>';it=false;}html+='<h3>'+l.replace(/^###\s*/,'')+'</h3>';continue;}
    if(/^\|[-|\s]+\|$/.test(l))continue;
    if(/^\|/.test(l)&&/\|$/.test(l)){
      if(!it){html+='<table>';it=true;}
      var cs=l.split('|').filter(function(c){return c.length>0;});
      html+='<tr>';for(var j=0;j<cs.length;j++)html+='<td>'+cs[j].trim()+'</td>';html+='</tr>';continue;
    }
    if(it){html+='</table>';it=false;}
    if(l.trim()===''){html+='<br>';continue;}
    if(/^>\s/.test(l)){html+='<div class="kc"><p>'+l.replace(/^>\s*/,'')+'</p></div>';continue;}
    html+='<p>'+l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>';
  }
  if(it)html+='</table>';return html;
}

// ===== Init =====
(function(){
  // Restore cache for instant display
  var wc=L('wx');if(wc&&Date.now()-wc.ts<600000)wxBuild(wc.d);
  var nc=L('news');if(nc&&nc.d&&nc.d.length)nsBuild(nc.d);
  var bc=L('brief');if(bc&&bc.s)bfBuild(bc.s);
  var cc=L('city');if(cc)document.getElementById('ci').textContent=cc;
  // Fetch fresh
  wxFetch();nsFetch();bfFetch();
  setInterval(wxFetch,600000);setInterval(nsFetch,600000);setInterval(bfFetch,900000);
})();
</script>
</body>
</html>

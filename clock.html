<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AI Nav 时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;display:flex;justify-content:center;align-items:center;background:#000}
body{width:390px;height:844px;max-height:100vh;background:#0a0a10;color:#e8e8ed;font-family:-apple-system,sans-serif;font-size:12px;line-height:1.35;padding:54px 6px 34px 6px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
.bg{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 70% 15%,rgba(56,189,248,.04) 0%,transparent 60%),radial-gradient(ellipse at 30% 70%,rgba(139,92,246,.03) 0%,transparent 50%)}
.g{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:minmax(52px,auto);gap:4px;align-content:start}
/* Glass tile */
.t{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:all .35s cubic-bezier(.25,.8,.25,1)}
.t::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 40%);pointer-events:none}
.t:active{transform:scale(.97)}
/* importance colors */
.t.lv-critical{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.15)}
.t.lv-high{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.1)}
.t.lv-normal{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.07)}
.t.lv-low{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03)}
.t.lv-sys{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04)}
/* Flash */
.flash{animation:fl .5s cubic-bezier(.4,0,.2,1)}
@keyframes fl{0%{filter:brightness(2.5) saturate(.5)}50%{filter:brightness(1.5)}100%{filter:brightness(1)}}
/* Span */
.c2{grid-column:span 2}.c3{grid-column:span 3}.r2{grid-row:span 2}.r3{grid-row:span 3}
/* Typography */
.tt{font-weight:700;line-height:1.2;color:#f0f0f6;letter-spacing:-.01em;margin-bottom:2px}
.ts{font-size:.82em;opacity:.55;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tm{font-size:.72em;opacity:.28;margin-top:auto;padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Keyword highlight */
.kw{color:#38bdf8;font-weight:800;font-size:1.05em}
.kw-hot{color:#f59e0b;font-weight:800}
.kw-crit{color:#ef4444;font-weight:800}
/* Clock */
.ck{text-align:center;justify-content:center}
.ckb{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1;text-shadow:0 0 30px rgba(56,189,248,.15)}
.ckms{font-size:17px;color:#38bdf8;font-weight:500;min-width:46px;display:inline-block;opacity:.82}
.ckd{font-size:10px;opacity:.28;margin-top:3px;font-weight:500}
/* Weather */
.wt{font-size:28px;font-weight:700;color:#f0f0f6}
.wd{font-size:11px;opacity:.5;margin-top:1px}
.wh{font-size:9px;opacity:.25;margin-top:2px}
/* New-item entrance */
.new-in{animation:ni .5s cubic-bezier(.25,.8,.25,1)}
@keyframes ni{0%{opacity:0;transform:translateY(8px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
</style></head><body>
<div class="bg"></div>
<div class="g" id="g"></div>
<script>
var A='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var WN={0:'晴天',1:'少云',2:'多云',3:'阴天',45:'雾',48:'霜雾',51:'小雨',53:'小雨',55:'中雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',77:'雪',80:'阵雨',81:'阵雨',82:'暴雨',85:'阵雪',86:'阵雪',95:'雷暴',96:'雷暴',97:'强雷暴'};

function tile(id,lv,sp,rs,html){return'<div class="t lv-'+lv+' '+(sp||'')+' '+(rs||'')+'" data-id="'+id+'">'+html+'</div>'}

// Highlight keywords in text
function hl(t,kws){
  if(!kws)return t;
  var k=kws.split(','),s=t;
  for(var i=0;i<k.length;i++){
    var kw=k[i].trim();if(!kw)continue;
    var cls='kw';if(kw.indexOf('!')===0){cls='kw-crit';kw=kw.slice(1)}
    else if(kw.indexOf('*')===0){cls='kw-hot';kw=kw.slice(1)}
    s=s.replace(new RegExp(kw,'g'),'<span class="'+cls+'">'+kw+'</span>');
  }
  return s;
}

function render(){
  var h='';
  h+=tile('clock','sys','c3 r2','','<div class="ck"><div class="ckb" id="ct">--:--:--<span class="ckms" id="cms">.---</span></div><div class="ckd" id="cd">----</div><div class="ckd"><span id="cci">广州</span></div></div>');
  h+=tile('wx','sys','c2 r2','','<div class="wt" id="wt">--°</div><div class="wd" id="wd">加载中</div><div class="wh" id="wh"></div>');
  h+=tile('w1','sys','','','<div class="tt">+1时</div><div class="ts" id="w1s">--</div>');
  h+=tile('w2','sys','','','<div class="tt">+3时</div><div class="ts" id="w2s">--</div>');
  h+=tile('w3','sys','','','<div class="tt">+6时</div><div class="ts" id="w3s">--</div>');
  for(var i=0;i<ns.length;i++){
    var n=ns[i],lv=n.level||'normal',sp=i===0?'c2':'',rs=i===0?'r2':'';
    h+=tile('n'+i,lv,sp,rs,'<div class="tt">'+hl(n.title,n.keywords)+'</div>'+(n.summary?'<div class="ts">'+hl(n.summary,n.keywords)+'</div>':'')+(n.metric?'<div class="tm">'+n.metric+'</div>':''));
  }
  document.getElementById('g').innerHTML=h;
}

var ns=[];

// Clock
function tick(){
  var n=new Date();
  var el=document.getElementById('ct');if(el)el.innerHTML=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2)+'<span class="ckms">.'+('00'+n.getMilliseconds()).slice(-3)+'</span>';
  el=document.getElementById('cd');if(el)el.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()];
}
setInterval(tick,80);tick();

// Weather
fetch(A+'/api/weather?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(w){
  var c=w.current,hh=w.hourly;
  document.getElementById('wt').textContent=Math.round(c.temperature_2m)+'°C';
  document.getElementById('wd').textContent=WN[c.weather_code]||'--';
  document.getElementById('wh').textContent='湿度 '+(c.relative_humidity_2m||'')+'%';
  if(hh&&hh.time){var cur=(new Date()).getHours();for(var i=0;i<3;i++){var idx=cur+[1,3,6][i];if(idx>=hh.time.length)idx=hh.time.length-1;document.getElementById('w'+(i+1)+'s').textContent=Math.round(hh.temperature_2m[idx])+'° '+WN[hh.weather_code[idx]]}}
  fetch(A+'/api/geocode?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(d){var a=(d&&d.address)||d||{};var c=a.city||a.town||a.county||'';if(c)document.getElementById('cci').textContent=c});
});

// News
fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){
  if(!d||!d.length)return;ns=d;render();
  setTimeout(fl,3000);
});

// Flash one tile
function fl(){
  var els=document.querySelectorAll('[data-id^="n"]');
  if(!els.length){setTimeout(fl,3000);return}
  var pool=[];
  for(var i=0;i<els.length;i++){var lv=ns[i]?ns[i].level:'normal';var w=lv==='low'?5:lv==='normal'?3:lv==='high'?2:1;for(var j=0;j<w;j++)pool.push(i)}
  var idx=pool[Math.floor(Math.random()*pool.length)],el=els[idx];
  if(!el){setTimeout(fl,1000);return}
  el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},500);
  var src=ns[Math.floor(Math.random()*ns.length)];
  var ti=el.querySelector('.tt');if(ti&&src)ti.innerHTML=hl(src.title,src.keywords);
  setTimeout(fl,900+Math.random()*2000);
}

setInterval(function(){fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){if(d&&d.length){ns=d;render()}})},600000);
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AI Nav 时钟</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,sans-serif;background:#050510;color:rgba(255,255,255,.9);font-size:13px;line-height:1.4;display:flex;flex-direction:column;padding:8px 10px 8px 10px;-webkit-user-select:none;user-select:none}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 20%,rgba(0,210,255,.04) 0%,transparent 60%)}
.card{flex-shrink:0;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 14px;position:relative;z-index:1;overflow:hidden;margin-top:4px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
/* Debug panel */
.dbg{position:fixed;bottom:0;left:0;right:0;z-index:99999;background:rgba(0,0,0,.9);color:#0f0;font-size:9px;font-family:monospace;padding:4px 8px;max-height:180px;overflow-y:auto;display:block}
</style>
</head>
<body>
<div class="bg"></div>

<!-- Simple card-based layout, same as working test page -->
<div class="card"><b style="color:#00e5ff">时钟</b> <span id="t1">--:--:--</span></div>
<div class="card"><b style="color:#00e5ff">天气</b> <span id="t2">loading...</span></div>
<div class="card"><b style="color:#00e5ff">新闻</b> <span id="t3">loading...</span></div>
<div class="card"><b style="color:#00e5ff">AI简报</b> <span id="t4">loading...</span></div>

<div class="dbg" id="dbg"></div>

<script>
var API='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
function log(m){var e=document.getElementById('dbg');e.innerHTML+=new Date().toLocaleTimeString()+' '+m+'<br>';e.scrollTop=e.scrollHeight;}
log('Page ready');

// Clock (pure JS, always works)
function tick(){var n=new Date();document.getElementById('t1').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2)};setInterval(tick,200);tick();

// Weather
log('Fetch weather...');
fetch(API+'/api/weather?lat=23.13&lon=113.26')
.then(function(r){log('WX response: '+r.status);return r.json();})
.then(function(d){var t=Math.round(d.current.temperature_2m)+'C '+d.current.weather_code;document.getElementById('t2').textContent=t;log('WX OK: '+t);})
.catch(function(e){document.getElementById('t2').textContent='FAIL';log('WX ERROR: '+e.message);});

// News
log('Fetch news...');
fetch(API+'/api/news')
.then(function(r){log('NS response: '+r.status);return r.json();})
.then(function(d){document.getElementById('t3').textContent=(Array.isArray(d)&&d.length?d.length+' articles':'empty');log('NS OK: '+(d?d.length:0));})
.catch(function(e){document.getElementById('t3').textContent='FAIL';log('NS ERROR: '+e.message);});

// Brief
log('Fetch brief...');
fetch(API+'/api/news-summary')
.then(function(r){log('BF response: '+r.status);return r.json();})
.then(function(d){document.getElementById('t4').textContent=(d&&d.summary?d.summary.length+' chars':'empty');log('BF OK');})
.catch(function(e){document.getElementById('t4').textContent='FAIL';log('BF ERROR: '+e.message);});
</script>
</body>
</html>

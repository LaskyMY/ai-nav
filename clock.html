<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=390,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><title>AI Nav</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}
body{background:#0a0a14;color:rgba(255,255,255,.9);font-family:system-ui,sans-serif;font-size:12px;line-height:1.35;padding:48px 5px 5px 5px}
.g{height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;overflow-y:auto;align-content:start}
.c{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;backdrop-filter:saturate(180%)blur(40px);-webkit-backdrop-filter:saturate(180%)blur(40px);overflow:hidden}
.c3{grid-column:span 3}.c2{grid-column:span 2}
.tt{font-weight:600;color:rgba(255,255,255,.88);line-height:1.3;margin-bottom:3px}.ts{font-size:.9em;color:rgba(255,255,255,.5);line-height:1.4}.tm{font-size:.7em;color:rgba(255,255,255,.3);margin-top:auto;padding-top:4px}
.ckb{font-size:40px;font-weight:700;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;line-height:1}
.ckms{font-size:13px;color:#818cf8;-webkit-text-fill-color:#818cf8;display:inline-block}.ckd{font-size:10px;text-align:center;color:rgba(255,255,255,.25);margin-top:2px}
.wx-c{min-height:100px;display:flex;align-items:center;justify-content:center}.sts{min-height:34px;display:flex;align-items:center;justify-content:space-between;font-size:10px;padding:6px 12px!important}.bf-c{min-height:70px}
.k1{color:#818cf8;font-weight:700}.k2{color:#fbbf24;font-weight:700}.k3{color:#f87171;font-weight:700}
.c.l1{border-color:rgba(239,68,68,.06);background:rgba(239,68,68,.025)}.c.l2{border-color:rgba(245,158,11,.05);background:rgba(245,158,11,.02)}
</style></head><body><div class="g" id="g"></div><script>
var A='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var WN={0:'晴',1:'少云',2:'多云',3:'阴',45:'雾',51:'雨',61:'雨',71:'雪',80:'雨',95:'雷'};
var ns=[],wxP=[],wxI=0,wxT=null;
function em(t){var s=(t||'').toLowerCase();if(/战争|冲突|空袭|军事|导弹/.test(s))return'💥';if(/经济|市场|股票|金融|利率/.test(s))return'📈';if(/政治|选举|总统|政府|法律/.test(s))return'🏛️';if(/科技|AI|芯片|数据/.test(s))return'🧠';if(/医疗|疾病|药物|疫苗/.test(s))return'💊';return'📡'}
function kw(t,k){if(!k||!t)return t;var s=t,ks=k.split(',');for(var i=0;i<ks.length;i++){var w=ks[i].trim();if(!w)continue;var c='k1';if(w[0]=='!'){c='k3';w=w.slice(1)}else if(w[0]=='*'){c='k2';w=w.slice(1)}s=s.split(w).join('<span class="'+c+'">'+w+'</span>')}return s}
function build(){
  var h='';var now=new Date(),nx=new Date(now.getTime()+600000);
  h+='<div class="c c3"><div class="ckb" id="t"></div><div class="ckd" id="td"></div></div>';
  h+='<div class="c c3 wx-c" id="wc"><div style="text-align:center"><span style="font-size:34px" id="wxi">☀️</span><div style="font-size:10px;color:rgba(255,255,255,.3);margin:3px 0"><span id="wxl">广州·当前</span></div><div style="font-size:24px;font-weight:700;color:#fff" id="wxt">--°</div></div></div>';
  h+='<div class="c c3 sts"><span>🔄 '+now.toLocaleTimeString('zh-CN')+' · '+(ns.length||0)+'条</span><span>⏱ '+nx.toLocaleTimeString('zh-CN')+'</span></div>';
  h+='<div class="c c3 bf-c"><div class="tt">📋 AI简报</div><div class="ts" id="sm"></div></div>';
  for(var i=0;i<ns.length;i++){var n=ns[i],lv=n.level==='critical'?'1':n.level==='high'?'2':'3';h+='<div class="c l'+lv+(i<2?' c2':'')+'"><div class="tt">'+em(n.title)+' '+kw(n.title,n.keywords)+'</div>'+(n.summary?'<div class="ts">'+kw(n.summary,n.keywords)+'</div>':'')+(n.metric?'<div class="tm">'+n.metric+'</div>':'')+'</div>'}
  document.getElementById('g').innerHTML=h;tick()
}
function tick(){var n=new Date();var el=document.getElementById('t');if(el)el.innerHTML=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2)+' <span class="ckms">.'+('00'+n.getMilliseconds()).slice(-3)+'</span>';el=document.getElementById('td');if(el)el.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()]}
function sx(i){var p=wxP[i];var a=document.getElementById('wxi'),b=document.getElementById('wxl'),c=document.getElementById('wxt');if(a)a.textContent=['☀️','🌤️','⛅','☁️','🌫️','🌧️','🌧️','❄️','🌦️','⛈️'][p.code%10]||'☀️';if(b)b.textContent=p.label;if(c)c.textContent=p.temp+'°C'}
function swx(){wxI=0;sx(0);wxT=setInterval(function(){wxI=(wxI+1)%wxP.length;sx(wxI)},5000)}

build();tick();setInterval(tick,40);
wxP=[{label:'广州·当前',temp:'27',code:0},{label:'+1时',temp:'28',code:1},{label:'+3时',temp:'30',code:0},{label:'+6时',temp:'26',code:2}];swx();
fetch(A+'/api/weather?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(w){var c=w.current,hh=w.hourly;wxP=[{label:'广州·当前',temp:Math.round(c.temperature_2m),code:c.weather_code}];if(hh&&hh.time){var cur=(new Date()).getHours();for(var i=0;i<3;i++){var idx=cur+[1,3,6][i];if(idx>=hh.time.length)idx=hh.time.length-1;wxP.push({label:'+'+(i*2+1)+'时',temp:Math.round(hh.temperature_2m[idx]),code:hh.weather_code[idx]})}}swx()}).catch(function(){});
// Load + fetch
try{var c2=JSON.parse(localStorage.getItem('an'));if(c2&&c2.length){ns=c2;build()}}catch(e){}
fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){if(d&&d.length){ns=d;try{localStorage.setItem('an',JSON.stringify(d))}catch(e){};build()}});
fetch(A+'/api/news-summary').then(function(r){return r.json()}).then(function(s){if(s&&s.summary){var el=document.getElementById('sm');if(el)el.textContent=s.summary.slice(0,400)}});
setInterval(function(){fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){if(d&&d.length){ns=d;try{localStorage.setItem('an',JSON.stringify(d))}catch(e){};build()}});fetch(A+'/api/news-summary').then(function(r){return r.json()}).then(function(s){if(s&&s.summary){var el=document.getElementById('sm');if(el)el.textContent=s.summary.slice(0,400)}})},600000);
</script></body></html>

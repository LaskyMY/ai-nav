<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>毫秒时钟 · 天气 · 新闻</title>
<link rel="icon" href="./icon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap');

:root{
--bg:#050510;--card-bg:rgba(255,255,255,.03);--card-border:rgba(255,255,255,.06);
--cyan:#00e5ff;--cyan2:rgba(0,229,255,.5);--cyan3:rgba(0,229,255,.15);
--warm:#ff9100;--warm2:rgba(255,145,0,.5);--warm3:rgba(255,145,0,.15);
--tx:rgba(255,255,255,.92);--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.28);--tx4:rgba(255,255,255,.1);
--r:18px;--r2:12px;--ease:cubic-bezier(.22,1,.36,1);
}

*,::before,::after{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;
min-height:100vh;min-height:100dvh;
padding:0 16px 40px;
-webkit-font-smoothing:antialiased;overflow-x:hidden;
-webkit-user-select:none;user-select:none;
-webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{display:none}

/* ---- Background ---- */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:
radial-gradient(circle at 50% 30%,rgba(0,229,255,.04) 0%,transparent 70%),
radial-gradient(circle at 20% 70%,rgba(0,229,255,.02) 0%,transparent 50%),
radial-gradient(circle at 80% 60%,rgba(0,229,255,.025) 0%,transparent 50%);
}
.bg-dots{position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);
background-size:32px 32px;
}
.scanline{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.012;
background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.5) 2px,rgba(0,0,0,.5) 4px);
}

/* ---- Back button ---- */
.back-bar{position:sticky;top:0;z-index:50;padding:12px 0 8px;
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
mask-image:linear-gradient(to bottom,black 60%,transparent);
-webkit-mask-image:linear-gradient(to bottom,black 60%,transparent);
}
.back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--cyan);
text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;
border-radius:20px;background:var(--cyan3);border:1px solid rgba(0,229,255,.1);
transition:all .3s var(--ease);letter-spacing:-.01em;
}
.back-btn:hover{background:var(--cyan3);border-color:var(--cyan2);}
.back-btn svg{width:14px;height:14px;}

/* ---- Main content ---- */
.main{position:relative;z-index:1;max-width:420px;margin:0 auto;}

/* ---- Clock ---- */
.clock-section{text-align:center;padding:8px 0 6px;}
.time-row{display:flex;align-items:baseline;justify-content:center;gap:0;}
.time-hms{font-family:'JetBrains Mono','SF Mono',monospace;font-size:56px;font-weight:200;
letter-spacing:.02em;color:var(--tx);
background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.7) 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
text-shadow:0 0 60px var(--cyan3),0 0 120px var(--cyan3);
line-height:1;
}
.time-ms{font-family:'JetBrains Mono','SF Mono',monospace;font-size:28px;font-weight:300;
color:var(--cyan);letter-spacing:.04em;line-height:1;
text-shadow:0 0 20px var(--cyan3),0 0 40px var(--cyan3);
min-width:70px;text-align:left;opacity:.85;
}
@media(max-width:360px){
.time-hms{font-size:44px}.time-ms{font-size:22px;min-width:56px}
}

.date-line{font-size:13px;color:var(--tx2);margin-top:4px;font-weight:400;letter-spacing:.02em;}
.date-lunar{font-size:11px;color:var(--tx3);margin-top:2px;}

/* ---- City ---- */
.city-line{text-align:center;font-size:12px;color:var(--tx2);margin:8px 0 2px;
display:flex;align-items:center;justify-content:center;gap:6px;
}
.city-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);
animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 4px var(--cyan)}50%{box-shadow:0 0 12px var(--cyan),0 0 20px var(--cyan2)}}

/* ---- Weather ---- */
.weather-section{margin:10px 0;}
.weather-now{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 4px;}
.weather-icon{font-size:40px;line-height:1;}
.weather-temp{font-size:42px;font-weight:200;letter-spacing:-.02em;color:var(--tx);}
.weather-desc{font-size:13px;color:var(--tx2);text-align:center;}

.weather-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0;}
.weather-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r2);
padding:12px 10px;text-align:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
transition:all .3s var(--ease);
}
.weather-card .wc-time{font-size:11px;color:var(--tx3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.weather-card .wc-icon{font-size:24px;margin-bottom:2px;}
.weather-card .wc-temp{font-size:20px;font-weight:300;color:var(--tx);}
.weather-card .wc-rain{font-size:10px;color:var(--cyan);margin-top:2px;}

.tomorrow-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r);
padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:4px;
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.tomorrow-card .tm-icon{font-size:28px;}
.tomorrow-card .tm-info{flex:1;}
.tomorrow-card .tm-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;}
.tomorrow-card .tm-temp{font-size:17px;font-weight:500;color:var(--tx);}
.tomorrow-card .tm-desc{font-size:12px;color:var(--tx2);}

/* ---- Holiday ---- */
.holiday-section{margin:14px 0;}
.holiday-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r);
padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
transition:all .3s var(--ease);
}
.holiday-info{display:flex;align-items:center;gap:10px;}
.holiday-emoji{font-size:28px;}
.holiday-name{font-size:15px;font-weight:600;color:var(--tx);}
.holiday-date{font-size:11px;color:var(--tx3);}
.holiday-countdown{text-align:right;}
.holiday-days{font-size:28px;font-weight:200;color:var(--warm);
text-shadow:0 0 30px var(--warm3);
}
.holiday-days-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;}

/* ---- Section titles ---- */
.section-title{font-size:10px;color:var(--tx4);text-transform:uppercase;letter-spacing:.08em;
padding:6px 0 4px;display:flex;align-items:center;gap:6px;
}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.04);}

/* ---- News ---- */
.news-section{margin:14px 0;}
.news-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r);
padding:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
position:relative;overflow:hidden;min-height:80px;
transition:all .3s var(--ease);
}
.news-card .news-source{font-size:10px;color:var(--tx4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.news-card .news-text{font-size:14px;font-weight:500;color:var(--tx);line-height:1.5;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.news-card .news-bar{display:flex;align-items:center;gap:8px;margin-top:10px;}
.news-card .news-dots{display:flex;gap:4px;}
.news-card .news-dot{width:5px;height:5px;border-radius:50%;background:var(--tx4);transition:all .4s var(--ease);}
.news-card .news-dot.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan2);width:14px;border-radius:3px;}
.news-card .news-counter{font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace;}
.news-card .news-timer{width:100%;height:1px;background:rgba(255,255,255,.03);margin-top:10px;border-radius:1px;overflow:hidden;}
.news-card .news-timer-fill{height:100%;background:var(--cyan);border-radius:1px;
transition:width 1s linear;width:0%;
}

/* ---- Footer ---- */
.footer{text-align:center;padding:20px 0 10px;}
.footer-tag{font-size:10px;color:var(--tx4);letter-spacing:.04em;
display:inline-flex;align-items:center;gap:4px;
}
.footer-dot{width:3px;height:3px;border-radius:50%;background:var(--cyan);animation:pulse-dot 2s ease-in-out infinite;}

/* ---- Loading / Error states ---- */
.loading{color:var(--tx3);font-size:12px;text-align:center;padding:8px;}
.error-hidden{display:none;}

/* ---- Transitions ---- */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .5s var(--ease) both;}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-dots"></div>
<div class="scanline"></div>

<div class="back-bar">
<a class="back-btn" href="./index.html">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
返回
</a>
</div>

<div class="main">

<!-- Clock -->
<div class="clock-section">
<div class="time-row">
<span class="time-hms" id="timeHMS">--:--:--</span>
<span class="time-ms" id="timeMS">.---</span>
</div>
<div class="date-line" id="dateLine">----年--月--日 星期-</div>
<div class="date-lunar" id="dateLunar"></div>
</div>

<!-- City -->
<div class="city-line">
<span class="city-dot"></span>
<span id="cityName">获取位置中...</span>
</div>

<!-- Weather Now -->
<div class="weather-now">
<span class="weather-icon" id="weatherIcon">--</span>
<span class="weather-temp" id="weatherTemp">--°</span>
</div>
<div class="weather-desc" id="weatherDesc">加载中...</div>

<!-- Weather next 2 hours -->
<div class="weather-row" id="weatherHours"></div>

<!-- Tomorrow -->
<div class="tomorrow-card" id="tomorrowCard">
<span class="tm-icon">--</span>
<div class="tm-info"><div class="tm-label">明天</div><div class="tm-temp">加载中...</div></div>
<span class="tm-desc">--</span>
</div>

<!-- Holiday -->
<div class="section-title">节日倒计时</div>
<div class="holiday-section" id="holidaySection"></div>

<!-- News -->
<div class="section-title">实时要闻 · 每分钟切换</div>
<div class="news-section">
<div class="news-card" id="newsCard">
<div class="news-source">加载中</div>
<div class="news-text">正在获取最新新闻...</div>
<div class="news-bar">
<div class="news-dots" id="newsDots"></div>
<span class="news-counter" id="newsCounter">0 / 0</span>
</div>
<div class="news-timer"><div class="news-timer-fill" id="newsTimerFill"></div></div>
</div>
</div>

<div class="footer">
<span class="footer-tag"><span class="footer-dot"></span> 实时数据引擎</span>
</div>

</div><!-- .main -->

<script>
// ======= CLOCK =======
const elHMS=document.getElementById('timeHMS');
const elMS=document.getElementById('timeMS');
const elDate=document.getElementById('dateLine');
const elLunar=document.getElementById('dateLunar');

const weekNames=['日','一','二','三','四','五','六'];

function pad(n,w){return String(n).padStart(w,'0');}

// Simple lunar calendar approximation for date display
function getLunarDayName(month,day){
const special={
'1-1':'春节','1-15':'元宵节',
'5-5':'端午节',
'8-15':'中秋节',
'9-9':'重阳节',
'12-30':'除夕','12-29':'除夕'
};
// Approximate lunar dates for 2026 (very rough)
const lunarApprox={'5-31':'四月十五','6-19':'五月初五','9-25':'八月十五','10-1':'国庆节'};
return lunarApprox[`${month}-${day}`]||'';
}

function updateClock(){
const now=new Date();
const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds(),ms=now.getMilliseconds();
const y=now.getFullYear(),mo=now.getMonth()+1,d=now.getDate();
const w=now.getDay();

elHMS.textContent=pad(h,2)+':'+pad(m,2)+':'+pad(s,2);
elMS.textContent='.'+pad(ms,3);
elDate.textContent=y+'年'+mo+'月'+d+'日 星期'+weekNames[w];

const lunarHint=getLunarDayName(mo,d);
elLunar.textContent=lunarHint?'农历 '+lunarHint:'';
}
updateClock();
setInterval(updateClock,17); // ~60fps for smooth ms

// ======= HOLIDAYS =======
const holidays=[
{name:'端午节',emoji:'🐲',date:'2026-06-19',color:'#4CAF50'},
{name:'中秋节',emoji:'🌕',date:'2026-09-25',color:'#FF9800'},
{name:'国庆节',emoji:'🇨🇳',date:'2026-10-01',color:'#F44336'},
{name:'春节',emoji:'🧧',date:'2027-02-06',color:'#E91E63'},
];

function findNextHoliday(){
const now=new Date();now.setHours(0,0,0,0);
let next=null,minDiff=Infinity;
holidays.forEach(h=>{
const d=new Date(h.date+'T00:00:00+08:00');
const diff=d-now;
if(diff>0&&diff<minDiff){minDiff=diff;next=h;}
});
return next?{...next,days:Math.ceil(minDiff/86400000)}:null;
}

function renderHoliday(){
const h=findNextHoliday();
const sec=document.getElementById('holidaySection');
if(!h){sec.innerHTML='<div class="holiday-card"><span style="color:var(--tx3)">近期无节日</span></div>';return;}
sec.innerHTML=`
<div class="holiday-card fade-in">
<div class="holiday-info">
<span class="holiday-emoji">${h.emoji}</span>
<div>
<div class="holiday-name" style="color:${h.color}">${h.name}</div>
<div class="holiday-date">${h.date}</div>
</div>
</div>
<div class="holiday-countdown">
<div class="holiday-days">${h.days}</div>
<div class="holiday-days-label">天后</div>
</div>
</div>`;
}
renderHoliday();
setInterval(renderHoliday,3600000); // refresh hourly

// ======= WEATHER =======
const weatherIcons={
0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',
71:'🌨️',73:'🌨️',75:'🌨️',80:'🌧️',81:'🌧️',82:'⛈️',
95:'⛈️',96:'⛈️',99:'⛈️'
};
function wIcon(code){return weatherIcons[code]||'🌡️';}
function wDesc(code){
if(code<=1)return '晴朗';if(code<=3)return '多云';if(code<=48)return '有雾';
if(code<=55)return '小雨';if(code<=65)return '有雨';if(code<=75)return '有雪';
if(code<=82)return '阵雨';return '雷暴';
}

async function fetchWeather(lat,lon){
const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=2`;
const r=await fetch(url);
if(!r.ok)throw new Error('Weather fetch failed');
return r.json();
}

async function reverseGeocode(lat,lon){
try{
const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=zh&zoom=12`);
if(!r.ok)throw new Error('Geocode failed');
const d=await r.json();
const addr=d.address||{};
return addr.city||addr.town||addr.county||addr.state||addr.country||'未知位置';
}catch(e){return lat.toFixed(2)+'°, '+lon.toFixed(2)+'°';}
}

// ======= NEWS =======
let newsItems=[];
let newsIdx=0;
let newsTimerSec=0;
const NEWS_INTERVAL=60; // seconds per news item

async function fetchNews(){
const sources=[
{url:'https://api.vvhan.com/api/hotlist/news',parse:d=>d.data?.map(i=>({title:i.title,source:i.source||'综合'}))},
{url:'https://api.oioweb.cn/api/top/hot',parse:d=>d.result?.map(i=>({title:i.title||i.name,source:i.desc||'热榜'}))},
];
for(const src of sources){
try{
const r=await fetch(src.url);
if(!r.ok)continue;
const d=await r.json();
const items=src.parse(d);
if(items&&items.length>0)return items.slice(0,20);
}catch(e){continue;}
}
return [];
}

function renderNews(){
if(newsItems.length===0){
document.querySelector('#newsCard .news-source').textContent='暂无新闻';
document.querySelector('#newsCard .news-text').textContent='正在尝试获取新闻数据...';
return;
}
const item=newsItems[newsIdx];
document.querySelector('#newsCard .news-source').textContent=item.source||'新闻';
document.querySelector('#newsCard .news-text').textContent=item.title;
document.querySelector('#newsCounter').textContent=(newsIdx+1)+' / '+newsItems.length;

const dots=document.getElementById('newsDots');
dots.innerHTML=newsItems.slice(0,10).map((_,i)=>`<div class="news-dot${i===newsIdx?' on':''}"></div>`).join('');
}

function nextNews(){
newsIdx=(newsIdx+1)%newsItems.length;
newsTimerSec=0;
renderNews();
}

function updateNewsTimer(){
if(newsItems.length===0)return;
newsTimerSec++;
const pct=(newsTimerSec/NEWS_INTERVAL)*100;
document.getElementById('newsTimerFill').style.width=pct+'%';
if(newsTimerSec>=NEWS_INTERVAL)nextNews();
}

async function initNews(){
newsItems=await fetchNews();
if(newsItems.length>0){
// Add more items by slightly shuffling to have ~10 items
if(newsItems.length<10){
newsItems=[...newsItems,...newsItems.map(i=>({...i}))].slice(0,10);
}
renderNews();
}else{
document.querySelector('#newsCard .news-source').textContent='新闻加载失败';
}
}

setInterval(updateNewsTimer,1000);

// ======= INIT =======
async function init(){
// Geolocation
if('geolocation' in navigator){
navigator.geolocation.getCurrentPosition(async pos=>{
const {latitude,longitude}=pos.coords;
// City name
const city=await reverseGeocode(latitude,longitude);
document.getElementById('cityName').textContent=city;

// Weather
try{
const w=await fetchWeather(latitude,longitude);
const cur=w.current;
document.getElementById('weatherTemp').textContent=Math.round(cur.temperature_2m)+'°';
document.getElementById('weatherIcon').textContent=wIcon(cur.weather_code);
document.getElementById('weatherDesc').textContent=wDesc(cur.weather_code)+' · 湿度'+cur.relative_humidity_2m+'%';

// Next 2 hours
const now=new Date();
const curHour=now.getHours();
const hourly=w.hourly;
const startIdx=hourly.time.findIndex(t=>new Date(t).getHours()===curHour+1);
const hoursEl=document.getElementById('weatherHours');
let hHTML='';
for(let i=0;i<3;i++){
const idx=startIdx+i;
if(idx>=0&&idx<hourly.time.length){
const t=new Date(hourly.time[idx]);
const label=i===0?'+1小时':i===1?'+2小时':'+3小时';
hHTML+=`<div class="weather-card fade-in" style="animation-delay:${i*.1}s">
<div class="wc-time">${label}</div>
<div class="wc-icon">${wIcon(hourly.weather_code[idx])}</div>
<div class="wc-temp">${Math.round(hourly.temperature_2m[idx])}°</div>
<div class="wc-rain">💧 ${hourly.precipitation_probability[idx]}%</div>
</div>`;
}
}
hoursEl.innerHTML=hHTML;

// Tomorrow
const d=w.daily;
const tomorrowCard=document.getElementById('tomorrowCard');
tomorrowCard.innerHTML=`
<span class="tm-icon">${wIcon(d.weather_code[1])}</span>
<div class="tm-info"><div class="tm-label">明天 ${new Date(d.time[1]).getMonth()+1}/${new Date(d.time[1]).getDate()}</div>
<div class="tm-temp">${Math.round(d.temperature_2m_min[1])}° ~ ${Math.round(d.temperature_2m_max[1])}°</div></div>
<span class="tm-desc">${wDesc(d.weather_code[1])}</span>`;
}catch(e){
document.getElementById('weatherDesc').textContent='天气加载失败';
}

},async err=>{
document.getElementById('cityName').textContent='位置获取失败';
document.getElementById('weatherDesc').textContent='需要位置权限';
},{enableHighAccuracy:false,timeout:8000,maximumAge:600000});
}else{
document.getElementById('cityName').textContent='无定位功能';
}

// News
initNews();

// Start news timer
}

init();

// Refresh news every 30 minutes
setInterval(()=>{
fetchNews().then(items=>{if(items.length>0){newsItems=items;newsIdx=0;newsTimerSec=0;renderNews();}});
},1800000);

// Refresh holiday at midnight
function msToMidnight(){
const now=new Date();
const mid=new Date(now);mid.setHours(24,0,0,0);
return mid-now;
}
setTimeout(()=>{renderHoliday();setInterval(renderHoliday,86400000);},msToMidnight()+1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AI Nav 时钟</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#06060e;color:#e8e8ed;font-family:-apple-system,sans-serif;font-size:12px;line-height:1.35;padding:calc(48px+var(--sat)) 6px calc(24px+var(--sab)) 6px;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
/* Background glows */
.bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0}
.bg::before{content:'';position:absolute;top:-40%;left:-20%;width:140%;height:140%;background:radial-gradient(ellipse at 60% 20%,rgba(56,189,248,.06) 0%,transparent 50%),radial-gradient(ellipse at 30% 60%,rgba(139,92,246,.04) 0%,transparent 40%),radial-gradient(ellipse at 70% 70%,rgba(239,68,68,.03) 0%,transparent 40%)}
/* Grid */
.g{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:auto;gap:4px;align-content:start;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Tile */
.t{position:relative;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);animation:ti .6s cubic-bezier(.25,.8,.25,1) both}
/* Edge glow — the key effect */
.t::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 50%,rgba(255,255,255,.02) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* Inner light reflection */
.t::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.03) 0%,transparent 50%);pointer-events:none;opacity:0;transition:opacity .6s}
.t:hover::after,.t:active::after{opacity:1}
/* Staggered entrance */
@keyframes ti{0%{opacity:0;transform:translateY(16px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
.t:nth-child(1){animation-delay:0s}.t:nth-child(2){animation-delay:.05s}.t:nth-child(3){animation-delay:.1s}.t:nth-child(4){animation-delay:.15s}.t:nth-child(5){animation-delay:.2s}.t:nth-child(6){animation-delay:.25s}.t:nth-child(7){animation-delay:.3s}.t:nth-child(8){animation-delay:.35s}.t:nth-child(9){animation-delay:.4s}.t:nth-child(10){animation-delay:.45s}.t:nth-child(11){animation-delay:.5s}.t:nth-child(12){animation-delay:.55s}
/* Glow by level */
.t.lv-critical{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.12);box-shadow:0 0 20px rgba(239,68,68,.06),inset 0 1px 0 rgba(255,255,255,.03)}
.t.lv-high{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.1);box-shadow:0 0 16px rgba(245,158,11,.04),inset 0 1px 0 rgba(255,255,255,.03)}
.t.lv-normal{background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.07);box-shadow:0 0 12px rgba(56,189,248,.03),inset 0 1px 0 rgba(255,255,255,.03)}
.t.lv-low{background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.t.lv-sys{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
/* Flash */
.flash{animation:fl .45s cubic-bezier(.4,0,.2,1)}
@keyframes fl{0%{filter:brightness(3) saturate(.3)}60%{filter:brightness(1.3)}100%{filter:brightness(1)}}
/* Span */
.c2{grid-column:span 2}.c3{grid-column:span 3}.r2{grid-row:span 2}.r3{grid-row:span 3}
/* Text */
.tt{font-weight:700;line-height:1.2;color:#f2f2f8;letter-spacing:-.01em;margin-bottom:2px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ts{font-size:.82em;opacity:.55;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tm{font-size:.72em;opacity:.25;margin-top:auto;padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Keywords */
.kw{color:#38bdf8;font-weight:800;font-size:1.08em;text-shadow:0 0 8px rgba(56,189,248,.2)}
.kw-hot{color:#f59e0b;font-weight:800;font-size:1.08em;text-shadow:0 0 8px rgba(245,158,11,.2)}
.kw-crit{color:#ef4444;font-weight:800;font-size:1.08em;text-shadow:0 0 8px rgba(239,68,68,.2)}
/* Clock */
.ck{text-align:center;justify-content:center}
.ckb{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1;text-shadow:0 0 30px rgba(56,189,248,.2)}
.ckms{font-size:16px;color:#38bdf8;font-weight:500;min-width:44px;display:inline-block;opacity:.82}
.ckd{font-size:10px;opacity:.28;margin-top:3px;font-weight:500}
/* Weather */
.wt{font-size:26px;font-weight:700;color:#f2f2f8}
.wd{font-size:11px;opacity:.5;margin-top:1px}
.wh{font-size:9px;opacity:.22;margin-top:2px}
</style></head><body>
<div class="bg"></div>
<div class="g" id="g"></div>

<script>
var A='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
var WN={0:'晴天',1:'少云',2:'多云',3:'阴天',45:'雾',48:'霜雾',51:'小雨',53:'小雨',55:'中雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',77:'雪',80:'阵雨',81:'阵雨',82:'暴雨',85:'阵雪',86:'阵雪',95:'雷暴',96:'雷暴',97:'强雷暴'};
var ns=[];

function T(id,lv,sp,rs,h){
  var delay=document.querySelectorAll('.t').length*.05;
  return'<div class="t lv-'+lv+' '+(sp||'')+' '+(rs||'')+'" data-id="'+id+'" style="animation-delay:'+delay+'s">'+h+'</div>'
}

function hl(t,kws){
  if(!kws||!t)return t||'';
  var s=t,k=kws.split(',');
  for(var i=0;i<k.length;i++){
    var kw=k[i].trim();if(!kw)continue;
    var cls='kw';
    if(kw[0]==='!'){cls='kw-crit';kw=kw.slice(1)}
    else if(kw[0]==='*'){cls='kw-hot';kw=kw.slice(1)}
    s=s.split(kw).join('<span class="'+cls+'">'+kw+'</span>');
  }
  return s;
}

function render(){
  var h='';
  h+=T('clock','sys','c3 r2','','<div class="ck"><div class="ckb" id="ct">--:--:--<span class="ckms" id="cms">.---</span></div><div class="ckd" id="cd">----</div><div class="ckd"><span id="cci">广州</span></div></div>');
  h+=T('wx','sys','c2 r2','','<div class="wt" id="wt">--°</div><div class="wd" id="wd">加载中</div><div class="wh" id="wh"></div>');
  h+=T('w1','sys','','','<div class="tt">+1时</div><div class="ts" id="w1s">--</div>');
  h+=T('w2','sys','','','<div class="tt">+3时</div><div class="ts" id="w2s">--</div>');
  h+=T('w3','sys','','','<div class="tt">+6时</div><div class="ts" id="w3s">--</div>');
  for(var i=0;i<ns.length;i++){
    var n=ns[i],lv=n.level||'normal',sp=i<2?'c2':'',rs=i<2?'r2':'';
    h+=T('n'+i,lv,sp,rs,'<div class="tt">'+hl(n.title,n.keywords)+'</div>'+(n.summary?'<div class="ts">'+hl(n.summary,n.keywords)+'</div>':'')+(n.metric?'<div class="tm">'+n.metric+'</div>':''));
  }
  document.getElementById('g').innerHTML=h;
}

// Clock 80ms
function tick(){
  var n=new Date(),el=document.getElementById('ct');
  if(el)el.innerHTML=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2)+'<span class="ckms">.'+('00'+n.getMilliseconds()).slice(-3)+'</span>';
  el=document.getElementById('cd');if(el)el.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()];
}
setInterval(tick,80);tick();

// Weather
fetch(A+'/api/weather?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(w){
  var c=w.current,hh=w.hourly;
  var e=document.getElementById('wt');if(e)e.textContent=Math.round(c.temperature_2m)+'°C';
  e=document.getElementById('wd');if(e)e.textContent=WN[c.weather_code]||'--';
  e=document.getElementById('wh');if(e)e.textContent='湿度 '+(c.relative_humidity_2m||'')+'%';
  if(hh&&hh.time){var cur=(new Date()).getHours();for(var i=0;i<3;i++){var idx=cur+[1,3,6][i];if(idx>=hh.time.length)idx=hh.time.length-1;e=document.getElementById('w'+(i+1)+'s');if(e)e.textContent=Math.round(hh.temperature_2m[idx])+'° '+WN[hh.weather_code[idx]]}}
  fetch(A+'/api/geocode?lat=23.13&lon=113.26').then(function(r){return r.json()}).then(function(d){var a=(d&&d.address)||d||{};var c=a.city||a.town||a.county||'';if(c){e=document.getElementById('cci');if(e)e.textContent=c}});
});

// News
fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){
  if(!d||!d.length)return;ns=d;render();setTimeout(fl,3000);
});

// Flash
function fl(){
  var els=document.querySelectorAll('[data-id^="n"]');
  if(!els.length){setTimeout(fl,3000);return}
  var pool=[];
  for(var i=0;i<els.length;i++){var lv=ns[i]?ns[i].level:'normal';var w=lv==='low'?5:lv==='normal'?3:lv==='high'?2:1;for(var j=0;j<w;j++)pool.push(i)}
  var idx=pool[Math.floor(Math.random()*pool.length)],el=els[idx];if(!el){setTimeout(fl,1000);return}
  el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},450);
  var src=ns[Math.floor(Math.random()*ns.length)];
  var ti=el.querySelector('.tt');if(ti&&src)ti.innerHTML=hl(src.title,src.keywords);
  setTimeout(fl,1000+Math.random()*2000);
}

setInterval(function(){fetch(A+'/api/news-cn').then(function(r){return r.json()}).then(function(d){if(d&&d.length){ns=d;render()}})},600000);
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>毫秒时钟 · 天气 · 新闻</title>
<link rel="icon" href="./icon.svg">
<style>

:root{
--sat:max(44px, env(safe-area-inset-top));
--sab:max(0px, env(safe-area-inset-bottom));
--bg:#050510;--card-bg:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.07);
--cyan:#00e5ff;--cyan2:rgba(0,229,255,.5);--cyan3:rgba(0,229,255,.12);
--warm:#ff9100;--warm3:rgba(255,145,0,.12);
--tx:rgba(255,255,255,.92);--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.28);--tx4:rgba(255,255,255,.1);
--r:16px;--r2:10px;--ease:cubic-bezier(.22,1,.36,1);
}

*,::before,::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
background:var(--bg);color:var(--tx);font-size:13px;line-height:1.4;
padding:var(--sat) 14px calc(14px + var(--sab));
display:flex;flex-direction:column;
-webkit-font-smoothing:antialiased;
-webkit-user-select:none;user-select:none;
-webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{display:none}

/* Background layers */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:
radial-gradient(circle at 50% 25%,rgba(0,229,255,.04) 0%,transparent 60%),
radial-gradient(circle at 30% 60%,rgba(0,229,255,.02) 0%,transparent 50%),
radial-gradient(circle at 70% 50%,rgba(0,229,255,.025) 0%,transparent 50%);
}
.bg-dots{position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
background-size:28px 28px;
}
.scanline{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.01;
background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.5) 2px,rgba(0,0,0,.5) 4px);
}

/* Back button */
.back-bar{flex-shrink:0;padding:4px 0 6px;position:relative;z-index:50;}
.back-btn{display:inline-flex;align-items:center;gap:3px;color:var(--cyan);
text-decoration:none;font-size:12px;font-weight:500;padding:5px 10px;
border-radius:16px;background:var(--cyan3);border:1px solid rgba(0,229,255,.08);
transition:all .3s var(--ease);
}
.back-btn svg{width:13px;height:13px;}

/* Main flex container */
.main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;max-width:420px;margin:0 auto;width:100%;min-height:0;gap:6px;}

/* Clock */
.clock-section{flex-shrink:0;text-align:center;padding:0;}
.time-row{display:flex;align-items:baseline;justify-content:center;gap:0;}
.time-hms{font-family:'Inter','SF Pro Display',-apple-system,sans-serif;font-size:52px;font-weight:700;
font-variant-numeric:tabular-nums;letter-spacing:.03em;color:rgba(255,255,255,.95); text-shadow:0 0 30px rgba(0,229,255,.3),0 0 80px rgba(0,229,255,.15);
line-height:1;
}
.time-ms{font-family:'Inter','SF Pro Display',-apple-system,sans-serif;font-size:24px;font-weight:600;
font-variant-numeric:tabular-nums;
color:var(--cyan);letter-spacing:.04em;line-height:1;
text-shadow:0 0 16px var(--cyan3),0 0 32px var(--cyan3);
min-width:62px;text-align:left;opacity:.85;
}
@media(max-width:360px){
.time-hms{font-size:44px}.time-ms{font-size:20px;min-width:52px}
}

.date-line{font-size:13px;color:var(--tx2);margin-top:2px;font-weight:500;letter-spacing:.02em;}
.date-lunar{font-size:11px;color:var(--tx3);margin-top:1px;}
.city-line{text-align:center;font-size:12px;font-weight:500;color:var(--tx2);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:5px;}
.city-dot{width:4px;height:4px;border-radius:50%;background:var(--cyan);animation:pulse-dot 2s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 3px var(--cyan)}50%{box-shadow:0 0 10px var(--cyan),0 0 16px var(--cyan2)}}

/* Shared card */
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
position:relative;overflow:hidden;
}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;
background:linear-gradient(135deg,rgba(255,255,255,.02) 0%,transparent 40%,transparent 60%,rgba(255,255,255,.01) 100%);pointer-events:none;}

/* Weather now - compact */
.weather-now-row{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:6px 14px;}
.weather-icon-lg{font-size:36px;line-height:1;}
.weather-temp{font-size:34px;font-weight:600;letter-spacing:-.02em;color:var(--tx);}
.weather-meta{font-size:12px;font-weight:500;color:var(--tx2);line-height:1.5;}
.weather-meta span{color:var(--tx3);font-size:11px;}

/* Weather hourly row */
.weather-hourly{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0;}
.wh-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r2);
padding:8px 6px;text-align:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.wh-time{font-size:10px;color:var(--tx3);margin-bottom:2px;font-weight:500;letter-spacing:.03em;}
.wh-icon{font-size:20px;}
.wh-temp{font-size:17px;font-weight:600;color:var(--tx);}
.wh-rain{font-size:10px;color:var(--cyan);margin-top:1px;}

/* Bottom 2-col: tomorrow + holiday */
.info-row{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.info-card{padding:10px 12px;display:flex;align-items:center;gap:8px;}
.info-card .ic-icon{font-size:22px;flex-shrink:0;}
.info-card .ic-body{flex:1;min-width:0;}
.info-card .ic-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px;}
.info-card .ic-main{font-size:14px;font-weight:600;color:var(--tx);}
.info-card .ic-sub{font-size:11px;color:var(--tx2);}
.info-card .ic-num{font-size:22px;font-weight:700;color:var(--warm);text-shadow:0 0 20px var(--warm3);}
.info-card .ic-num-label{font-size:10px;color:var(--tx3);}

/* News */
.ai-brief{flex-shrink:0;padding:14px 16px;border-color:rgba(168,85,247,.2);}
.ai-brief .ab-header{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(168,85,247,.1)}
.ai-brief .ab-dot{width:5px;height:5px;border-radius:50%;background:var(--purple);animation:pulse-dot 2s ease-in-out infinite}
.ai-brief .ab-label{font-size:10px;font-weight:600;color:#a855f7;text-transform:uppercase;letter-spacing:.06em}
.ai-brief .ab-time{font-size:9px;color:var(--tx4);margin-left:auto}
.ai-brief .ab-text{font-size:12px;color:var(--tx2);line-height:1.75}
.ai-brief .ab-text h2{font-size:14px;font-weight:700;color:var(--tx);margin:12px 0 6px;padding:0}
.ai-brief .ab-text h3{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);margin:10px 0 4px}
.ai-brief .ab-text strong{color:#f59e0b;font-weight:600}
.ai-brief .ab-text table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
.ai-brief .ab-text td,.ai-brief .ab-text th{padding:5px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
.ai-brief .ab-text th{color:var(--tx3);font-weight:500;font-size:10px}
.ai-brief .ab-text td{color:var(--tx2)}
.ai-brief .ab-card{background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.12);border-radius:8px;padding:10px 12px;margin:8px 0}
.ai-brief .ab-card .abc-title{font-size:11px;font-weight:600;color:#c084fc;margin-bottom:4px}
.ai-brief .ab-card .abc-body{font-size:11px;color:var(--tx2);line-height:1.6}

.news-card{flex-shrink:0;padding:10px 14px;min-height:0;}
.news-card .ns-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.news-card .ns-source{font-size:9px;font-weight:500;color:var(--tx4);text-transform:uppercase;letter-spacing:.06em;}
.news-card .ns-counter{font-size:10px;font-weight:500;color:var(--tx3);font-variant-numeric:tabular-nums;}
.news-card .ns-text{font-size:13px;font-weight:600;color:var(--tx);line-height:1.45;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.news-card .ns-footer{display:flex;align-items:center;gap:6px;margin-top:6px;}
.news-card .ns-dots{display:flex;gap:3px;flex:1;}
.news-card .ns-dot{width:4px;height:4px;border-radius:50%;background:var(--tx4);transition:all .4s var(--ease);}
.news-card .ns-dot.on{background:var(--cyan);box-shadow:0 0 5px var(--cyan2);width:14px;border-radius:3px;}
.news-card .ns-timer{width:100%;height:1px;background:rgba(255,255,255,.03);border-radius:1px;overflow:hidden;}
.news-card .ns-timer-fill{height:100%;background:var(--cyan);border-radius:1px;transition:width 1s linear;width:0%;}

@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s var(--ease) both;}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-dots"></div>
<div class="scanline"></div>
<canvas id="worldCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.16;"></canvas>

<div class="back-bar">
<a class="back-btn" href="./index.html">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
返回
</a>
</div>

<div class="main">

<div class="clock-section">
<div class="time-row">
<span class="time-hms" id="timeHMS">--:--:--</span>
<span class="time-ms" id="timeMS">.---</span>
</div>
<div class="date-line" id="dateLine">----年--月--日 星期-</div>
<div class="date-lunar" id="dateLunar"></div>
<div class="city-line"><span class="city-dot"></span><span id="cityName">获取位置中...</span></div>
</div>

<div class="card weather-now-row">
<span class="weather-icon-lg" id="weatherIcon">--</span>
<span class="weather-temp" id="weatherTemp">--°</span>
<div class="weather-meta"><div id="weatherDesc">加载中...</div><span id="weatherHumidity"></span></div>
</div>

<div class="weather-hourly" id="weatherHours"></div>

<div class="info-row">
<div class="card info-card" id="tomorrowCard">
<span class="ic-icon">--</span>
<div class="ic-body"><div class="ic-label">明天</div><div class="ic-main">加载中...</div><div class="ic-sub">--</div></div>
</div>
<div class="card info-card" id="holidayCard">
<span class="ic-icon">🎌</span>
<div class="ic-body" id="holidayBody"><div class="ic-label">节日倒计时</div><div class="ic-main">加载中...</div></div>
</div>
</div>

<div class="card ai-brief" id="aiBrief" style="display:none">
<div class="ab-header"><div class="ab-dot"></div><span class="ab-label">AI 新闻简报</span><span class="ab-time" id="abTime"></span></div>
<div class="ab-text" id="abText">加载中...</div>
</div>

<div class="card news-card" id="newsCard">
<div class="ns-header"><span class="ns-source">新闻</span><span class="ns-counter" id="newsCounter">加载中</span></div>
<div class="ns-text">正在获取最新新闻...</div>
<div class="ns-footer">
<div class="ns-dots" id="newsDots"></div>
</div>
<div class="ns-timer"><div class="ns-timer-fill" id="newsTimerFill"></div></div>
</div>

</div><!-- .main -->

<script>
// ===== WORLD MAP =====
(function(){
const c=document.getElementById('worldCanvas');
const ctx=c.getContext('2d');

const continents={
NA:[[168,69],[160,55],[150,64],[142,60],[128,54],[124,50],[117,33],[106,20],[97,16],[90,19],[84,28],[78,27],[72,41],[67,46],[56,48],[52,42],[66,35],[64,25],[74,24],[78,8],[82,5],[76,8],[90,22],[97,28],[108,22],[117,33],[128,40],[130,56],[142,58],[154,58],[162,65],[168,69]],
SA:[[80,8],[76,3],[80,-5],[72,-15],[65,-22],[60,-35],[55,-40],[50,-35],[42,-23],[41,-14],[35,-6],[37,2],[34,5],[40,12],[51,12],[60,8],[65,5],[73,10],[80,8]],
EU:[[-10,36],[-10,42],[1,43],[5,46],[10,43],[20,42],[28,46],[30,42],[34,40],[40,42],[42,38],[36,35],[27,37],[22,36],[12,37],[-5,35],[-10,36]],
AF:[[-17,15],[-16,28],[-4,35],[10,36],[12,33],[25,32],[32,32],[36,28],[43,12],[50,9],[50,2],[43,-5],[41,-17],[33,-27],[28,-33],[18,-35],[12,-29],[11,-17],[6,-5],[-5,5],[-17,15]],
AS:[[40,42],[46,38],[48,30],[55,26],[58,22],[70,22],[73,18],[80,20],[88,22],[95,22],[100,13],[107,11],[110,17],[115,20],[120,26],[125,35],[128,40],[140,42],[142,48],[138,55],[128,55],[120,56],[110,58],[105,62],[95,65],[80,70],[68,76],[55,72],[48,70],[40,60],[42,52],[40,42]],
SEA:[[95,22],[102,15],[105,8],[108,2],[115,-3],[105,-8],[98,-5],[95,-2],[95,5],[98,10],[100,18],[95,22]],
AU:[[115,-15],[120,-12],[130,-11],[140,-14],[150,-22],[152,-28],[146,-34],[137,-35],[130,-32],[120,-30],[114,-27],[113,-22],[115,-15]],
GR:[[-23,60],[-20,65],[-30,70],[-45,72],[-60,78],[-50,82],[-30,80],[-18,75],[-23,60]],
UK:[[-6,49],[-4,55],[-6,60],[-10,58],[-7,54],[-10,50],[-6,49]],
JP:[[130,30],[134,32],[140,38],[145,42],[143,38],[140,33],[135,31],[130,30]],
MG:[[44,-12],[50,-14],[50,-20],[48,-26],[44,-25],[43,-20],[44,-12]],
NZ:[[166,-35],[174,-36],[178,-40],[172,-44],[168,-43],[166,-38],[166,-35]],
};

const cities=[
[116.4,39.9,'北京'],[121.5,31.2,'上海'],[139.7,35.7,'东京'],[-74,40.7,'纽约'],
[-0.1,51.5,'伦敦'],[2.3,48.8,'巴黎'],[37.6,55.8,'莫斯科'],[55.3,25.3,'迪拜'],
[151.2,-33.9,'悉尼'],[127,37.6,'首尔'],[103.8,1.3,'新加坡'],[114.2,22.3,'香港'],
[-122.4,37.8,'旧金山'],[77.2,28.6,'新德里'],[100.5,13.7,'曼谷'],
];

function ll2xy(lon,lat,W,H){
const px=W*.04,py=H*.06;
return[px+(lon+180)/360*(W-px*2),py+(90-lat)/180*(H-py*2)];
}

function drawMap(t){
const dpr=Math.min(window.devicePixelRatio||1,2);
const W=c.clientWidth,H=c.clientHeight;
if(c.width!==W*dpr||c.height!==H*dpr){c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
ctx.clearRect(0,0,W,H);
ctx.fillStyle='rgba(2,8,20,.6)';ctx.fillRect(0,0,W,H);

const now=new Date();
const utcH=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;
const doy=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
const decl=-23.44*Math.cos((360/365)*(doy+10)*Math.PI/180);
const sunLon=(utcH-12)*15;

// Grid
ctx.strokeStyle='rgba(255,255,255,.012)';ctx.lineWidth=.5;
for(let lat=-60;lat<=60;lat+=30){const[,y]=ll2xy(0,lat,W,H);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
for(let lon=-150;lon<=150;lon+=30){const[x]=ll2xy(lon,0,W,H);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

// Continents
ctx.fillStyle='rgba(0,229,255,.06)';ctx.strokeStyle='rgba(0,229,255,.1)';ctx.lineWidth=.6;
for(const poly of Object.values(continents)){
ctx.beginPath();
var pts=poly;if(pts[0]&&Array.isArray(pts[0])&&Array.isArray(pts[0][0])){pts=pts[0];}
for(let i=0;i<pts.length;i++){const[x,y]=ll2xy(pts[i][0],pts[i][1],W,H);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.closePath();ctx.fill();ctx.stroke();
}

// Day/night
const sunX=((sunLon+180)/360)*W;
for(let x=0;x<W;x+=3){const d=Math.min(Math.abs(x-sunX)/(W*.35),1);ctx.fillStyle=`rgba(5,5,30,${.08+d*.2})`;ctx.fillRect(x,0,3,H);}

// Terminator glow
const grad=ctx.createLinearGradient(sunX-W*.12,0,sunX+W*.12,0);
grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(.45,'rgba(255,180,80,.03)');
grad.addColorStop(.5,'rgba(255,150,50,.05)');grad.addColorStop(.55,'rgba(255,180,80,.03)');
grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.fillRect(sunX-W*.12,0,W*.24,H);

// Cities
for(const[lon,lat,name]of cities){
const[cx,cy]=ll2xy(lon,lat,W,H);
const isDay=Math.abs(cx-sunX)<W*.3;
const pulse=1+Math.sin(t*.002+lon*.1)*.25;
const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,4*pulse);
grd.addColorStop(0,isDay?'rgba(255,200,100,.6)':'rgba(0,229,255,.45)');
grd.addColorStop(.6,isDay?'rgba(255,150,50,.1)':'rgba(0,200,240,.08)');
grd.addColorStop(1,'rgba(0,0,0,0)');
ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,1,0,Math.PI*2);ctx.fillStyle=isDay?'rgba(255,220,150,.7)':'rgba(0,240,255,.55)';ctx.fill();
if(['北京','上海','东京','纽约','伦敦','悉尼','迪拜'].includes(name)){
ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='7px Inter,sans-serif';ctx.fillText(name,cx+4,cy-3);
}
}
requestAnimationFrame(drawMap);
}
requestAnimationFrame(drawMap);
})();

// ===== CLOCK =====
const elHMS=document.getElementById('timeHMS'),elMS=document.getElementById('timeMS');
const elDate=document.getElementById('dateLine'),elLunar=document.getElementById('dateLunar');
const WK=['日','一','二','三','四','五','六'];
function pad(n,w){return String(n).padStart(w,'0');}
function updateClock(){
const now=new Date();
elHMS.textContent=pad(now.getHours(),2)+':'+pad(now.getMinutes(),2)+':'+pad(now.getSeconds(),2);
elMS.textContent='.'+pad(now.getMilliseconds(),3);
elDate.textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+WK[now.getDay()];
const lunarHint={5:'四月十五',6:'五月初五',9:'八月十五',10:'国庆节'};
const k=now.getMonth()+1+'-'+now.getDate();
elLunar.textContent=lunarHint[now.getMonth()+1]?'农历 '+lunarHint[now.getMonth()+1]:'';
}
updateClock();setInterval(updateClock,17);

// ===== HOLIDAY =====
const holidays=[{n:'端午节',e:'🐲',d:'2026-06-19'},{n:'中秋节',e:'🌕',d:'2026-09-25'},{n:'国庆节',e:'🇨🇳',d:'2026-10-01'},{n:'春节',e:'🧧',d:'2027-02-06'}];
function updateHoliday(){
const now=new Date();now.setHours(0,0,0,0);
let next=null,min=Infinity;
for(const h of holidays){const diff=new Date(h.d+'T00:00:00+08:00')-now;if(diff>0&&diff<min){min=diff;next=h;}}
if(!next)return;
const days=Math.ceil(min/86400000);
document.getElementById('holidayBody').innerHTML=`<div class="ic-label">节日倒计时</div><div class="ic-main">${next.e} ${next.n}</div><div class="ic-sub">${next.d}</div>`;
document.getElementById('holidayCard').querySelector('.ic-icon').textContent='';
const numEl=document.createElement('span');numEl.className='ic-num';numEl.textContent=days;
const lbl=document.createElement('span');lbl.className='ic-num-label';lbl.textContent='天后';
const right=document.createElement('div');right.style.cssText='text-align:right;flex-shrink:0;';
right.append(numEl);right.append(lbl);
const card=document.getElementById('holidayCard');
const old=card.querySelector('.ic-num');if(old)old.parentElement.remove();
card.appendChild(right);
}
updateHoliday();

// ===== WEATHER =====
const WI={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌧️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
function wIcon(c){return WI[c]||'🌡️';}
function wTxt(c){if(c<=1)return'晴朗';if(c<=3)return'多云';if(c<=48)return'有雾';if(c<=55)return'小雨';if(c<=65)return'有雨';if(c<=75)return'有雪';if(c<=82)return'阵雨';return'雷暴';}

const WC_KEY='clock_weather',WC_TS='clock_weather_ts',WC_TTL=600000; // 10 min weather cache
const CC_KEY='clock_city',CC_TS='clock_city_ts',CC_TTL=3600000; // 1 hour city cache

function loadWeatherCache(){try{const ts=localStorage.getItem(WC_TS);if(ts&&Date.now()-parseInt(ts)<WC_TTL){const d=localStorage.getItem(WC_KEY);if(d)return JSON.parse(d);}}catch(e){}return null}
function saveWeatherCache(data){try{localStorage.setItem(WC_KEY,JSON.stringify(data));localStorage.setItem(WC_TS,Date.now().toString());}catch(e){}}
function loadCityCache(){try{const ts=localStorage.getItem(CC_TS);if(ts&&Date.now()-parseInt(ts)<CC_TTL)return localStorage.getItem(CC_KEY);return null;}catch(e){return null}}
function saveCityCache(city){try{localStorage.setItem(CC_KEY,city);localStorage.setItem(CC_TS,Date.now().toString());}catch(e){}}

function renderWeather(w){
const cur=w.current;
document.getElementById('weatherIcon').textContent=wIcon(cur.weather_code);
document.getElementById('weatherTemp').textContent=Math.round(cur.temperature_2m)+'°';
document.getElementById('weatherDesc').textContent=wTxt(cur.weather_code);
document.getElementById('weatherHumidity').textContent='湿度 '+cur.relative_humidity_2m+'%';
const now=new Date();const curH=now.getHours();
const start=w.hourly.time.findIndex(t=>new Date(t).getHours()===curH+1);
const labels=['+1小时','+2小时','+3小时'];
let h='';
for(let i=0;i<3;i++){
const idx=start+i;
if(idx>=0&&idx<w.hourly.time.length){
h+=`<div class="wh-card fade-in" style="animation-delay:${i*.08}s">
<div class="wh-time">${labels[i]}</div>
<div class="wh-icon">${wIcon(w.hourly.weather_code[idx])}</div>
<div class="wh-temp">${Math.round(w.hourly.temperature_2m[idx])}°</div>
<div class="wh-rain">💧${w.hourly.precipitation_probability[idx]}%</div></div>`;
}
}
document.getElementById('weatherHours').innerHTML=h;
const d=w.daily;
const t=new Date(d.time[1]);
document.getElementById('tomorrowCard').innerHTML=`
<span class="ic-icon">${wIcon(d.weather_code[1])}</span>
<div class="ic-body"><div class="ic-label">明天 ${t.getMonth()+1}/${t.getDate()}</div>
<div class="ic-main">${Math.round(d.temperature_2m_min[1])}° ~ ${Math.round(d.temperature_2m_max[1])}°</div>
<div class="ic-sub">${wTxt(d.weather_code[1])}</div></div>`;
}

let API_BASE='https://c46872d35aeba559-183-6-87-29.serveousercontent.com';
(async function(){try{const r=await fetch('./api-config.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();if(d.api)API_BASE=d.api;}catch(e){}})();

async function tryWorkerOrDirect(workerPath,directUrl,timeoutMs){
// Try Worker first (short timeout)
try{const r=await fetch(API_BASE+workerPath,{signal:AbortSignal.timeout(Math.min(timeoutMs,3000))});if(r.ok)return r;}catch(e){}
// Fallback to direct
return fetch(directUrl,{signal:AbortSignal.timeout(timeoutMs)});
}

async function fetchFreshWeather(lat,lon){
let city=lat.toFixed(1)+'°,'+lon.toFixed(1)+'°';
try{
const r=await tryWorkerOrDirect(
`/api/geocode?lat=${lat}&lon=${lon}`,
`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=zh&zoom=12`,
4000
);
if(r.ok){
try{const d=await r.json();const a=d.address||d;city=a.city||a.town||a.county||a.state||d.city||city;}catch(e){}
}
}catch(e){}
document.getElementById('cityName').textContent=city;
saveCityCache(city);

try{
const r=await tryWorkerOrDirect(
`/api/weather?lat=${lat}&lon=${lon}`,
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=2`,
8000
);
if(!r.ok)throw new Error('bad');
const w=await r.json();
saveWeatherCache(w);
renderWeather(w);
}catch(e){if(!loadWeatherCache())document.getElementById('weatherDesc').textContent='加载失败';}
}

async function initWeather(){
if(!navigator.geolocation)return;
const cachedCity=loadCityCache();
if(cachedCity)document.getElementById('cityName').textContent=cachedCity;
const cachedW=loadWeatherCache();
if(cachedW)renderWeather(cachedW);
navigator.geolocation.getCurrentPosition(async function(pos){
const{latitude:lat,longitude:lon}=pos.coords;
try{await fetchFreshWeather(lat,lon);}catch(e){if(!cachedW)document.getElementById('weatherDesc').textContent='加载失败';}
},function(err){if(!cachedW){fetchFreshWeather(23.13,113.26);}},{enableHighAccuracy:false,timeout:5000,maximumAge:600000});
}
initWeather();


// ===== NEWS (with localStorage cache) =====
const NEWS_KEY='clock_news_cache',NEWS_TS='clock_news_ts',NEWS_TTL=300000; // 5 min cache
let newsItems=[],newsIdx=0,newsTimerSec=0,NEWS_INT=60;

async function fetchWithTimeout(url,ms=3000){
const ctrl=new AbortController();
const t=setTimeout(()=>ctrl.abort(),ms);
try{const r=await fetch(url,{signal:ctrl.signal});clearTimeout(t);return r;}catch(e){clearTimeout(t);throw e;}
}

async function fetchNewsFresh(){
try{const r=await fetchWithTimeout(API_BASE+'/api/news',2500);if(r.ok){const items=await r.json();if(items?.length)return items.slice(0,16);}}catch(e){}
const sources=[
{url:'https://api.vvhan.com/api/hotlist/news',parse:d=>d.data?.map(i=>({title:i.title,source:i.source||'综合'}))},
{url:'https://api.oioweb.cn/api/top/hot',parse:d=>d.result?.map(i=>({title:i.title||i.name,source:i.desc||'热榜'}))},
];
const tasks=sources.map(async(s)=>{
try{const r=await fetchWithTimeout(s.url,4000);if(!r.ok)return null;const d=await r.json();const items=s.parse(d);return items?.length?items.slice(0,16):null;}catch(e){return null;}
});
const timeout=new Promise(r=>setTimeout(()=>r(null),5000));
const results=await Promise.race([Promise.all(tasks).then(a=>a.find(x=>x!==null)||[]),timeout]);
return results||[];
}
function loadNewsCache(){
try{const ts=localStorage.getItem(NEWS_TS);if(ts&&Date.now()-parseInt(ts)<NEWS_TTL){const data=localStorage.getItem(NEWS_KEY);if(data){const items=JSON.parse(data);if(items.length>0)return items;}}}catch(e){}
return null;
}
function saveNewsCache(items){try{localStorage.setItem(NEWS_KEY,JSON.stringify(items));localStorage.setItem(NEWS_TS,Date.now().toString());}catch(e){}}

function renderNews(){
if(!newsItems.length)return;
const item=newsItems[newsIdx];
document.querySelector('#newsCard .ns-source').textContent=item.source||'新闻';
document.querySelector('#newsCard .ns-text').textContent=item.title;
document.getElementById('newsCounter').textContent=(newsIdx+1)+'/'+newsItems.length;
const dots=document.getElementById('newsDots');
dots.innerHTML=newsItems.slice(0,10).map((_,i)=>`<div class="ns-dot${i===newsIdx?' on':''}"></div>`).join('');
}

function nextNews(){newsIdx=(newsIdx+1)%newsItems.length;newsTimerSec=0;renderNews();}
function tickNews(){
if(!newsItems.length)return;
newsTimerSec++;
const pct=Math.min((newsTimerSec/NEWS_INT)*100,100);
document.getElementById('newsTimerFill').style.width=pct+'%';
if(newsTimerSec>=NEWS_INT)nextNews();
}

async function initNews(){
// Show cached news immediately
const cached=loadNewsCache();
if(cached){newsItems=cached;renderNews();}

// Fetch fresh in background
const fresh=await fetchNewsFresh();
if(fresh.length>0){
if(!cached||fresh[0].title!==cached[0].title){
newsItems=fresh;newsIdx=0;newsTimerSec=0;renderNews();
}
saveNewsCache(fresh);
}else if(!cached){
document.querySelector('#newsCard .ns-text').textContent='新闻加载失败，请检查网络';
}
}

setInterval(tickNews,1000);

// AI Brief - rich markdown renderer
function renderMarkdown(md){
var h=md;
// Headings
h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
// Bold
h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
// Knowledge cards: lines starting with > become cards
h=h.replace(/^> (.+)$/gm,'<div class="ab-card"><div class="abc-body">$1</div></div>');
// Tables: convert markdown table to HTML
var lines=h.split('\n');
var inTable=false,tableHtml='';
var processed=[];
for(var i=0;i<lines.length;i++){
var l=lines[i].trim();
if(l.match(/^\|.+\|$/)){
if(!inTable){inTable=true;tableHtml='<table>';}
var cells=l.split('|').filter(function(c){return c.trim();});
var isHeader=l.match(/^\|[\s\-:]+\|$/);
if(isHeader)continue; // skip separator row
var tag=inTable&&tableHtml.split('<tr').length===1?'th':'td';
tableHtml+='<tr>'+cells.map(function(c){return '<'+tag+'>'+c.trim()+'</'+tag+'>';}).join('')+'</tr>';
}else{
if(inTable){tableHtml+='</table>';processed.push(tableHtml);tableHtml='';inTable=false;}
processed.push(l);
}
}
if(inTable){tableHtml+='</table>';processed.push(tableHtml);}
h=processed.join('\n');
return h;
}
